#setBtn { transition: transform .35s var(--spring), opacity .3s; }
body.scrolled:not(.set-open) #setBtn { opacity: 0; pointer-events: none; transform: scale(.8); }

/* ---------- menu button and sidebar, after the Claude app: a plain list with line icons, dim section labels,
   your name at the bottom and a white pill for a new workout ---------- */
#menuBtn { position: fixed; z-index: 21; overflow: visible; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 560px) / 2 + 16px)); transition: transform .35s var(--spring), opacity .3s; }
#menuBtn svg { width: 21px; height: 21px; color: var(--text); }
#menuBtn .nbadge { top: -2px; left: auto; right: -2px; }
body.scrolled:not(.set-open) #menuBtn { opacity: 0; pointer-events: none; transform: scale(.8); }
.side { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.side-scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .35s; }
.side-panel { position: absolute; top: 0; bottom: 0; left: 0; width: min(340px, 88vw); background: var(--bg); border-right: 1px solid var(--line); box-shadow: 0 0 50px rgba(0,0,0,.3); transform: translateX(-104%); transition: transform .45s var(--ease); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 0 calc(env(safe-area-inset-bottom, 0px) + 10px); touch-action: pan-y; }
.side.open { pointer-events: auto; }
.side.open .side-scrim { opacity: 1; }
.side.open .side-panel { transform: none; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 18px 8px 22px; zoom: var(--z); }
.side-head h2 { margin: 0; font: 500 29px/1.1 ui-serif, "New York", Georgia, serif; letter-spacing: -.01em; }
.side-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 10px 8px; zoom: var(--z); }
.sl { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 46px; padding: 6px 12px; border: 0; background: none; border-radius: 13px; text-align: left; font-size: 16px; color: var(--text); }
.sl:active { background: var(--fill-2); }
.sl svg { flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.sl span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl small { flex: none; color: var(--dim); font-size: 12.5px; }
.sl .sdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--g1); }
.sl .nb2 { flex: none; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: #ff3b30; color: #fff; font-size: 11px; font-weight: 700; line-height: 19px; text-align: center; }
.side-lab { padding: 18px 12px 4px; font-size: 13.5px; color: var(--dim); }
.side-more { display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px; border: 0; background: none; color: var(--dim); font-size: 15px; }
.side-foot { display: flex; align-items: center; gap: 6px; padding: 10px 12px 0 8px; border-top: 1px solid var(--line); zoom: var(--z); }
.side-me { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px; border: 0; background: none; border-radius: 13px; text-align: left; }
.side-me span { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.side-me b { font-weight: 500; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-me small { color: var(--dim); font-size: 12.5px; }
.side-me b em { font-style: normal; color: var(--dim); font-weight: 400; }
.side-av { flex: none; width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, var(--g1) 18%, var(--fill-2)); display: grid; place-items: center; color: var(--g1); }
.side-av svg { width: 22px; height: 22px; }
.side-new { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px 0 13px; border: 0; border-radius: 999px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 15.5px; transition: transform .3s var(--spring); }
.side-new:active { transform: scale(.95); }

/* ---------- gear and settings ---------- */
.roundbtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; padding: 0; transition: transform .35s var(--spring); }
.roundbtn:active { transform: scale(.9); transition-duration: .12s; }
#setBtn { overflow: visible; position: fixed; z-index: 21; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px), calc((100vw - 560px) / 2 + 16px)); }
#setBtn .gear { width: 21px; height: 21px; color: var(--text); opacity: 1; transition: transform 1.1s cubic-bezier(.2,.8,.2,1), opacity .2s; }
body.set-open #setBtn .gear { transform: rotate(120deg); opacity: 1; }
.modal { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 14px) 10px calc(env(safe-area-inset-bottom, 0px) + 14px); pointer-events: none; }
.mscrim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .35s; }
/* every section opens in the same box: a fixed height, and only the section underneath the tabs scrolls */
.modal .settings { width: min(540px, 100%); height: min(680px, 100%); display: flex; flex-direction: column; overflow: hidden; padding: 0; margin: 0; opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .3s, transform .55s var(--spring); }
.modal.open { pointer-events: auto; }
.modal.open .mscrim { opacity: 1; }
.modal.open .settings { opacity: 1; transform: none; }
.modal:not(.open) .settings { visibility: hidden; transition: opacity .3s, transform .55s var(--spring), visibility 0s .45s; }
.set-head, .set-panels { zoom: var(--z); }
.set-head { padding: 22px 22px 0; }
.set-head h2 { font-size: 23px; letter-spacing: -.02em; margin: 0; }
.iconbtn { width: 34px; height: 34px; border-radius: 10px; border: none; background: transparent; display: grid; place-items: center; color: var(--dim); transition: background .2s, transform .3s var(--spring); padding: 0; }
.iconbtn:active { transform: scale(.9); background: var(--fill-2); }
.iconbtn svg { width: 19px; height: 19px; }
.set-close { position: absolute; top: 15px; right: 15px; z-index: 2; }
.set-nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 12px 14px 2px; }
.set-nav::-webkit-scrollbar { display: none; }
.set-nav button { flex: none; border: none; background: none; padding: 8px 10px; border-radius: 10px; font-size: 14px; color: var(--dim); transition: background .2s, color .2s; }
.set-nav button.on { background: var(--fill-2); color: var(--text); font-weight: 600; }
.set-head, .set-nav { flex: none; }
.set-panels { padding: 2px 14px 18px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.set-panel { display: none; }
.set-panel.on { display: block; animation: panelIn .45s var(--ease); }
@keyframes panelIn { from { opacity: 0; transform: translateY(6px); } }
.srow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 13px 6px; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: none; }
.srow > div:first-child { min-width: 0; flex: 1 1 140px; }
.srow b { display: block; font-weight: 500; font-size: 15px; }
.srow small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 1px; }
.srow > :last-child:not(:first-child) { flex: none; }
.switch { flex: none; width: 48px; height: 28px; border-radius: 999px; border: none; background: var(--fill-2); position: relative; transition: background .25s; padding: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .45s var(--spring); }
.switch[aria-checked="true"] { background: var(--accent-grad); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.sg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); max-width: 100%; padding: 3px; border-radius: 12px; background: var(--fill); flex: none; }
.sg::before { content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n, 2)); border-radius: 9px; background: var(--drop); box-shadow: var(--drop-shadow); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .5s var(--spring); }
.sg button { position: relative; border: none; background: none; padding: 7px 11px; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; color: var(--dim); white-space: nowrap; transition: color .2s; }
.sg button.on { color: var(--text); font-weight: 600; }
.sg[style*="--n:4"] button { padding: 7px 8px; font-size: 13px; }
.swatches { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; flex: 0 1 auto; }
.srow > .swatches:last-child:not(:first-child) { flex: 0 1 auto; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); transition: transform .3s var(--spring); }
.swatches button.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
select.sel { appearance: none; -webkit-appearance: none; color: var(--text); font: 500 16px var(--font); padding: 0 34px 0 14px; min-height: 42px; border-radius: 999px; border: 1px solid var(--edge); background: var(--fill) var(--chev) no-repeat right 14px center; max-width: 100%; transition: transform .3s var(--spring); }
select.sel:active { transform: scale(.97); }
select.sel.block { width: 100%; border-radius: 15px; min-height: 46px; }
.field { height: 46px; border-radius: 15px; background: var(--fill); border: 1px solid var(--line); padding: 0 14px; width: 100%; min-width: 0; color: var(--text); font-size: 16px; }
.field.small { width: 160px; height: 42px; }
textarea.field { height: auto; min-height: 80px; padding: 11px 14px; resize: vertical; line-height: 1.45; }
.field::placeholder { color: var(--dim); }
/* iOS gives date fields a fixed inner width that pushes them out of their column; make them behave like the other fields */
input.field[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; line-height: 44px; }
input.field.small[type=date] { line-height: 40px; }
input.field[type=date]::-webkit-date-and-time-value { text-align: left; margin: 0; }
.lab { font-size: 12.5px; color: var(--dim); font-weight: 600; margin: 0 0 6px; display: block; }

/* ---------- buttons ---------- */
.btn-primary, .btn-glass { border: none; padding: 13px 22px; border-radius: 999px; font-weight: 600; font-size: 15px; transition: transform .35s var(--spring), box-shadow .3s, background .2s; }
.btn-primary { color: var(--on-grad); background: var(--accent-grad); box-shadow: 0 6px 18px color-mix(in srgb, var(--g1) 32%, transparent); }
.btn-glass { position: relative; background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--glass-shadow); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); }
.btn-primary:active, .btn-glass:active { transform: scale(.96); transition-duration: .12s; }
.btn-primary:disabled { opacity: .55; }
.btn-small { padding: 9px 16px; font-size: 14px; }
.wide { width: 100%; min-height: 50px; font-size: 16px; }
.btn-quiet { background: none; border: 0; color: var(--dim); font-weight: 600; min-height: 44px; width: 100%; font-size: 14.5px; border-radius: 999px; }
.danger { color: var(--down); }
.armed { background: var(--down) !important; color: #fff !important; }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; background: var(--fill); border: 1px solid var(--line); color: var(--text); transition: transform .35s var(--spring); }
.chip:active { transform: scale(.94); }
.tile { padding: 12px 13px; border-radius: 17px; background: var(--fill); border: 1px solid var(--line); min-width: 0; }
.tile small { display: block; color: var(--dim); font-size: 12px; }
.tile b { font-size: 20px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: block; line-height: 1.25; }
.tile b.nil { font-size: 15px; color: var(--dim); font-weight: 500; line-height: 1.6; }
.tile em { font-style: normal; display: block; color: var(--dim); font-size: 11.5px; margin-top: 1px; }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; bottom: calc(-1 * var(--gap)); z-index: 40; pointer-events: none; }
.sheet-wrap.open { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .35s; }
.sheet-wrap.open .scrim { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; margin: 0 auto; width: calc(100% - 14px); max-width: 560px; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gap) + 7px); border-radius: 32px; padding: 9px 0 0; display: flex; flex-direction: column; max-height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--gap) - 36px); transform: translateY(110%); transition: transform .5s var(--ease); will-change: transform; }
.sheet.tall { height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--gap) - 36px); }
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap:not(.open) .sheet { visibility: hidden; transition: transform .5s var(--ease), visibility 0s .5s; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 0 auto 10px; }
.sheet-head { zoom: var(--z); padding: 0 18px 10px; touch-action: none; flex: none; }
.sheet-body { zoom: var(--z); overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 2px 18px 20px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.sh-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sh-top h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; line-height: 1.15; }
.sh-top small { color: var(--dim); font-size: 12.5px; }
.x { border: 0; background: var(--fill-2); border-radius: 999px; min-height: 32px; padding: 0 13px; font-size: 13.5px; font-weight: 600; flex: none; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(max(env(safe-area-inset-bottom, 0px) - var(--gap), 0px) + 74px); z-index: 60; transform: translate(-50%, 30px); opacity: 0; padding: 9px 17px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; pointer-events: none; transition: transform .6s var(--spring), opacity .4s, bottom .3s; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
body.resting .toast { bottom: calc(max(env(safe-area-inset-bottom, 0px) - var(--gap), 0px) + 130px); }

/* ---------- page parts ---------- */
/* the top bar: the page title centred between the menu button and the gear, like the Claude app. A small line under
   it shows the save status or the sets in a running workout, and only when there is something to say. */
.top { height: 42px; margin: -2px 56px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.top h1 { margin: 0; max-width: 100%; font-size: 25px; letter-spacing: -.02em; line-height: 1.12; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top small { display: none; color: var(--dim); font-size: 11.5px; align-items: center; justify-content: center; gap: 6px; line-height: 1.2; white-space: nowrap; }
.top small:has(> span:not(:empty)) { display: flex; }
.top small .status::before { width: 6px; height: 6px; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--dim); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.status[data-s="ok"]::before { background: var(--up); }
.status[data-s="busy"]::before { background: var(--warn); }
.status[data-s="off"]::before { background: var(--down); }
.notice { font-size: 14px; color: var(--dim); }
.row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.filters { display: flex; gap: 8px; margin-bottom: 12px; }
.filters .sel { flex: 1 1 0; min-width: 0; }
.empty { text-align: center; padding: 28px 20px; }
.empty .row { justify-content: center; }
.hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hd small { color: var(--dim); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.claude { display: flex; gap: 9px; align-items: flex-start; margin-top: 12px; font-size: 14px; }
.claude i { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-grad); display: grid; place-items: center; color: var(--on-grad); font-style: normal; font-size: 11px; font-weight: 700; margin-top: 1px; }
.claude p { margin: 0; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.good, .kd.good { background: var(--up); } .dot.some, .kd.some { background: var(--warn); } .dot.pain, .kd.pain { background: var(--down); }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two > * { min-width: 0; }

/* today */
.ci { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.ci > div { min-width: 0; }
.ci-sum { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.ci-line { margin: 6px 0 0; font-size: 13.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.ci-line b { color: var(--text); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--fill-2); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill i { font-style: normal; color: var(--dim); font-weight: 500; }
.folder { margin-top: 14px; }
.fhead { display: flex; align-items: center; gap: 6px; }
.ftog { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 36px; border: 0; background: none; padding: 0; text-align: left; font-weight: 700; font-size: 15px; min-width: 0; }
.ftog .chev { display: inline-block; width: 16px; color: var(--dim); transition: transform .3s var(--ease); }
.folder.open .ftog .chev { transform: rotate(90deg); }
.ftog small { color: var(--dim); font-weight: 500; font-size: 13px; }
.frows { display: none; flex-direction: column; margin-top: 2px; }
.folder.open .frows { display: flex; }
.wrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; margin-top: 6px; border-radius: 16px; background: var(--fill); border: 1px solid var(--line); text-align: left; transition: transform .3s var(--spring); }
.wrow:active { transform: scale(.98); }
.wrow > span { min-width: 0; display: flex; flex-direction: column; }
.wrow b { font-weight: 600; font-size: 15px; }
.wrow small { color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { flex: none; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--accent-grad); color: var(--on-grad); }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
.day { min-width: 0; padding: 6px 2px 7px; border-radius: 14px; background: var(--fill); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 62px; }
.day.today { background: var(--fill-2); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.day.future { background: transparent; }
.day small { font-size: 10.5px; color: var(--dim); font-weight: 600; }
.day b { font-size: 16px; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.marks { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 3px; }
.m { min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; font-size: 10px; font-weight: 700; display: grid; place-items: center; line-height: 1; max-width: 100%; overflow: hidden; }
.m.s { background: var(--accent-grad); color: var(--on-grad); }
.m.k { box-shadow: inset 0 0 0 1.5px var(--text); font-weight: 600; }
.m.c { width: 6px; min-width: 6px; height: 6px; padding: 0; background: var(--dim); }

/* workout */
.cards { display: flex; flex-direction: column; }
.ex { scroll-margin-top: 20px; }

/* cards view: one exercise at a time, swipe between them, with an overview grid */
.deck { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; }
.dk-n { font-size: 13px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 36px; }
.dk-dots { flex: 1; display: flex; gap: 4px; min-width: 0; }
.dk { flex: 1 1 0; min-width: 0; padding: 12px 0; background: none; border: 0; }
.dk span { display: block; height: 5px; border-radius: 3px; background: var(--fill-2); overflow: hidden; transition: height .35s var(--spring), box-shadow .25s; }
.dk.on span { height: 9px; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--text) 40%, transparent); }
.dk i { display: block; height: 100%; background: var(--accent-grad); border-radius: inherit; transition: width .45s var(--ease); }
.dk.done i { background: var(--up); }
.cards.deck-on { position: relative; flex-direction: row; align-items: flex-start; gap: 12px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; margin: 0 -16px; padding: 6px 22px 22px; margin-bottom: -10px; }
.cards.deck-on::-webkit-scrollbar { display: none; }
.cards.deck-on .ex { flex: 0 0 100%; min-width: 0; margin-bottom: 0; scroll-snap-align: center; scroll-snap-stop: always; }
/* The card in focus is full size; the ones on each side shrink and fade as they slide away */
@supports (animation-timeline: view()) {
  .cards.deck-on .ex { animation: deckPeek linear both; animation-timeline: view(inline); }
}
@keyframes deckPeek { 0% { transform: scale(.88); opacity: .35; } 50% { transform: none; opacity: 1; } 100% { transform: scale(.88); opacity: .35; } }
.ovw { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 12px; }
.ovt { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; text-align: left; padding: 14px; border-radius: 22px; min-height: 116px; min-width: 0; transition: transform .35s var(--spring); animation: ovIn .5s var(--spring) both; animation-delay: calc(var(--j, 0) * 35ms); }
.ovt:active { transform: scale(.96); transition-duration: .12s; }
.ovt small { color: var(--dim); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
.ovt b { font-size: 15.5px; line-height: 1.2; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ovt .ovs { margin-top: auto; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.ovt .ovbar { width: 100%; height: 5px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.ovt .ovbar i { display: block; height: 100%; background: var(--accent-grad); border-radius: inherit; }
.ovt.done .ovbar i { background: var(--up); }
.ovt.done small::after { content: "  ✓"; color: var(--up); }
.ovw { position: relative; }
.ovhint { grid-column: 1 / -1; margin: 0 0 2px; }
.ovw.editing .ovt { overflow: visible; touch-action: none; animation: jiggle .24s ease-in-out infinite alternate; animation-delay: calc(var(--j, 0) * -60ms); }
.ovw.editing .ovt:nth-child(even) { animation-direction: alternate-reverse; }
@keyframes jiggle { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
.ovw .ovt.lift { animation: none !important; z-index: 5; transition: none; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.ovt .ovdel { display: none; position: absolute; top: -8px; left: -8px; z-index: 4; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px; background: var(--text); color: var(--bg); font-style: normal; font-weight: 700; font-size: 17px; line-height: 26px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.ovw.editing .ovt .ovdel { display: block; }
.ovt .ovdel.armed { font-size: 12px; }
.ovt.cur { box-shadow: var(--glass-shadow), 0 0 0 2px color-mix(in srgb, var(--g1) 65%, transparent); }
@keyframes ovIn { from { opacity: 0; transform: translateY(10px) scale(.94); } }
.ex-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 10px; }
.ex-head > div { min-width: 0; }
.ex-head > div:first-child { flex: 1 1 96px; }
.ex-acts { display: flex; gap: 6px; align-items: center; flex: none; margin-left: auto; }
.ex-acts .sel { min-height: 34px; padding-left: 12px; padding-right: 28px; background-position: right 10px center; font-weight: 600; }
.ex h2 { font-size: 19px; }
.woacts { display: flex; gap: 8px; margin: -6px 0 14px; }
.woacts #add-top { margin-left: auto; }
#wo-live.decking > .two { display: none; }
.logrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
.logrow button { min-height: 50px; font-size: 16px; }
.logrow .btn-glass { padding: 0 20px; }
/* flashcards fill the space down to the tab bar; a card that is still too tall scrolls inside itself */
.vin.fit #wo-live { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.vin.fit #wo-live > * { flex: none; }
.vin.fit #wo-live > #cards.deck-on { flex: 1 1 auto; min-height: 0; align-items: stretch; padding-bottom: 4px; margin-bottom: 0; }
.vin.fit #wo-live > #overview { flex: 1 1 auto; min-height: 0; overflow-y: auto; align-content: start; overscroll-behavior: contain; padding: 12px 10px 6px; margin: -6px -10px 0; }
.vin.fit #wo-live > #wo-end:empty { display: none; }
.vin.fit .cards.deck-on .ex { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.cards.deck-on .feel small { display: none; }
.cards.deck-on .feel { margin-top: 10px; }
.cards.deck-on .stp { padding: 5px 5px 4px; }
.cards.deck-on .stp input { font-size: 28px; }
.cards.deck-on .pm button { height: 36px; }
.woacts .chip.fin { background: var(--accent-grad); color: var(--on-grad); border-color: transparent; }
.ex.done h2::after { content: "  ✓"; color: var(--up); }
.ex.skipped h2, .ex.skipped .sub { opacity: .5; }
.skipbox { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; padding: 9px 9px 9px 13px; border-radius: 15px; background: var(--fill); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.skipbox > span { min-width: 0; }
.skipbox small { display: block; color: var(--dim); font-weight: 400; font-size: 12.5px; overflow-wrap: anywhere; }
.chip[aria-pressed="true"] { background: var(--accent-grad); color: var(--on-grad); border-color: transparent; }
.ovt.skip { opacity: .55; }
.steppers.duo { grid-template-columns: 1fr 1fr; }
.two:has(> #add-warm[hidden]) { grid-template-columns: 1fr; }
.restpill .rl em { font-style: normal; }
.dk.skip span { opacity: .4; }
.dk.fin { flex: 0 0 18px; }
.dk.fin span { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dim); }
.last { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; margin-top: 8px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; line-height: 1.45; }
.last b { color: var(--text); font-weight: 600; }
.tg-reset { flex: none; min-height: 26px; margin: -5px 0 -4px; padding: 0 11px; font-size: 12.5px; animation: tg-in .35s var(--spring); }
.rir .lab:has(.tg-reset:not([hidden])) .rir-u { display: none; }
@keyframes tg-in { from { opacity: 0; transform: scale(.7); } }
.wdone { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.eff { margin-top: 14px; }
.eff-b { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.eff-b .chip { min-height: 42px; font-size: 14.5px; }
.pace .vs { font-weight: 650; }
.pace .vs.up { color: var(--up); }
.wdone button { min-height: 52px; font-size: 16px; }
.badge { display: inline-flex; margin-top: 10px; padding: 4px 11px; border-radius: 999px; background: var(--accent-grad); color: var(--on-grad); font-size: 12px; font-weight: 600; }
.logged { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.logged:empty { display: none; }
.setchip { min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--fill-2); border: 0; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.setchip i { font-style: normal; font-size: 11px; color: var(--dim); font-weight: 600; }
button.setchip { color: var(--text); transition: transform .3s var(--spring), background .2s; }
.setchip.new { animation: chipIn .5s var(--spring) both; }
@keyframes chipIn { from { transform: scale(.55); opacity: 0; } }
/* Records and Body, and the day on Food, ease in when you switch instead of jumping */
.pg-rec, .pg-body { animation: pgIn .32s var(--ease) both; }
@keyframes pgIn { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .setchip.new, .pg-rec, .pg-body { animation: none; } }
button.setchip:active { transform: scale(.94); background: color-mix(in srgb, var(--g1) 18%, var(--fill-2)); }
/* edit a set */
.se { display: flex; flex-direction: column; gap: 14px; }
.se-g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.se-st { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 16px; background: var(--fill); border: 1px solid var(--line); }
.se-st .ib { flex: none; width: 40px; height: 44px; border-radius: 12px; border: 0; background: var(--glass); color: var(--text); font-size: 22px; font-weight: 500; display: grid; place-items: center; padding: 0; transition: transform .3s var(--spring); }
.se-st .ib:active { transform: scale(.9); }
.se-st .field { flex: 1; min-width: 0; width: 100%; height: 44px; padding: 0; border: 0; background: none; box-shadow: none; text-align: center; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.se-st span { flex: none; margin: 0 2px 0 -4px; color: var(--dim); font-size: 13px; }
.se .btn-quiet { margin-top: -6px; }
.setchip.armed i { color: inherit; }
.steppers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; }
.stp { min-width: 0; padding: 7px 5px 5px; border-radius: 19px; background: var(--fill); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }
.stp label { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.stp input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-size: 32px; font-weight: 650; letter-spacing: -.03em; line-height: 1.15; padding: 0; font-variant-numeric: tabular-nums; border-radius: 10px; }
.stp input::placeholder { color: var(--dim); opacity: .45; }
.pm { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 100%; margin-top: 2px; }
.pm button { height: 40px; border-radius: 999px; border: 0; background: var(--fill-2); font-size: 21px; font-weight: 500; line-height: 1; transition: transform .3s var(--spring); }
.pm button:active { transform: scale(.92); }
/* Slide mode: one plain slider per value, full width. Tap the number to type it instead. */
.steppers.slide { grid-template-columns: 1fr; gap: 6px; }
.steppers.slide .stp { display: grid; grid-template-columns: 56px minmax(0, 1fr) 74px; grid-template-areas: "l r v"; align-items: center; column-gap: 8px; padding: 2px 12px; min-height: 50px; border-radius: 16px; }
.steppers.slide .stp label { grid-area: l; white-space: nowrap; }
.steppers.slide .stp input:not(.rng), .steppers.slide .stp output { grid-area: v; text-align: right; font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.steppers.slide .stp output.free { font-size: 14px; color: var(--dim); font-weight: 600; letter-spacing: 0; }
/* touch-action pan-y: a sideways drag anywhere on the strip moves the slider, an up or down swipe still scrolls the page */
.rng { grid-area: r; -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; padding: 0; background: transparent; touch-action: pan-y; --p: 0%; }
.rng:focus { outline: none; }
.rng::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--g1), var(--g2)) 0 0 / var(--p) 100% no-repeat, var(--fill-2); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.12); }
.rng::-moz-range-track { height: 8px; border-radius: 4px; background: var(--fill-2); }
.rng::-moz-range-progress { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--g1), var(--g2)); }
.rng::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.28); }
/* In slide mode the number of sets is a slider too, so the picker in the header goes */
.ex[data-mode="slide"] .ex-acts .sel:not([data-warm-act]) { display: none; }
.ex .wide { margin-top: 10px; }
/* exercise notes: earlier notes you can swipe through, and a small field for today's */
.nprev { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; margin: 10px -18px 0; padding: 0 18px; }
.nprev::-webkit-scrollbar { display: none; }
.npi { flex: 0 0 auto; max-width: 80%; scroll-snap-align: start; padding: 7px 12px; border-radius: 14px; background: var(--fill); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.35; }
.npi small { display: block; color: var(--dim); font-size: 11.5px; font-weight: 600; }
.field.exs { height: 40px; margin-top: 10px; border-radius: 13px; padding: 0 13px; }
/* the rating: four equal buttons across the card, in line with the RIR row and Log set above */
.feel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin-top: 12px; }
.feel small { grid-column: 1 / -1; color: var(--dim); font-size: 12px; font-weight: 600; }
.feel .chip { width: 100%; min-width: 0; min-height: 38px; padding: 0 4px; font-size: 13.5px; white-space: nowrap; }
textarea.field.exn { display: block; min-height: 40px; height: 40px; margin-top: 10px; padding: 9px 13px; border-radius: 13px; resize: none; overflow: hidden; }
/* 1RM test: the ladder from warm-up to PR attempt */
.ladder { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px -18px 0; padding: 0 18px; }
.ladder::-webkit-scrollbar { display: none; }
.lst { flex: 0 0 auto; padding: 7px 11px; border-radius: 14px; background: var(--fill); border: 1px solid var(--line); }
.lst small { display: block; font-size: 11px; color: var(--dim); font-weight: 600; }
.lst b { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lst.done { opacity: .5; }
.lst.done b::after { content: " ✓"; color: var(--up); }
.lst.cur { background: color-mix(in srgb, var(--g1) 18%, var(--fill)); border-color: color-mix(in srgb, var(--g1) 55%, var(--line)); }
.rmlist { margin-top: 10px; }
.rmlist .li { cursor: default; }
.rmlist .rmrow { min-height: 40px; padding: 6px 2px; }
.rmlist .rmrow small { margin-left: 6px; }
.goal { padding: 10px 0; }

/* rest */
.restpill { position: fixed; z-index: 19; left: 0; right: 0; margin: 0 auto; width: calc(100% - 40px); max-width: 400px; bottom: calc(max(env(safe-area-inset-bottom, 0px) - var(--gap), 0px) + 66px); border-radius: 999px; padding: 5px 5px 5px 16px; display: flex; align-items: center; gap: 9px; transition: transform .35s var(--ease), opacity .25s; }
.restpill .rl { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; font-size: 10.5px; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.restpill .rl span { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11.5px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.restpill .t { font-size: 21px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; padding: 1px 8px; border-radius: 999px; line-height: 1.2; }
.restpill.over .t { background: var(--accent-grad); color: var(--on-grad); }
.restpill .g { font-size: 11.5px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.restpill .bar { flex: 1; min-width: 20px; height: 4px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.restpill .bar i { display: block; height: 100%; width: 0; background: var(--accent-grad); transition: width .5s linear; }
.ib { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fill-2); display: grid; place-items: center; flex: none; padding: 0; }
.ib svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ib[aria-pressed="false"] { opacity: .55; }

/* log calendar */
.calhead { display: flex; justify-content: space-between; align-items: center; }
.calhead h2 { font-size: 18px; }
.calnav { display: flex; gap: 4px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.cal .wd { text-align: center; font-size: 11px; color: var(--dim); font-weight: 600; padding-bottom: 2px; }
.cd { aspect-ratio: 1 / .8; min-width: 0; border: 0; border-radius: 12px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 0; gap: 2px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; }
.cd.out { opacity: .3; }
.cd.today { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, var(--line)); }
.cd.sel { background: var(--accent-grad); color: var(--on-grad); }
.cd .dots { display: flex; gap: 3px; height: 6px; }
.cd .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.cd .dots i.s { background: var(--accent-grad); }
.cd.sel .dots i.s { background: var(--on-grad); }
.cd .dots i.k { box-shadow: inset 0 0 0 1.5px currentColor; }
.cd .dots i.c { background: currentColor; opacity: .45; width: 4px; height: 4px; margin-top: 1px; }
.hrow { display: grid; grid-template-columns: 1fr 12px; align-items: center; gap: 10px; width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.hrow:first-of-type { border-top: 0; }
.hrow .mn { min-width: 0; display: flex; flex-direction: column; }
.hrow .mn b { font-weight: 600; }
.hrow .mn small { font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kd { width: 9px; height: 9px; border-radius: 50%; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-weight: 500; font-size: 15.5px; }
.li > span { min-width: 0; }
.li small { color: var(--dim); font-size: 12.5px; font-weight: 400; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.lgroup { display: flex; flex-direction: column; }
.lgroup > .lab { margin: 4px 0 2px; }
.lgroup .li:first-of-type { border-top: 0; }
.exr { padding-top: 12px; border-top: 1px solid var(--line); }
.exr:first-child { border-top: 0; padding-top: 0; }
.exr b { font-weight: 600; }
.note { white-space: pre-wrap; margin: 0; padding: 11px 13px; border-radius: 15px; background: var(--fill); border: 1px solid var(--line); font-size: 14.5px; }
.unit { position: relative; }
.unit .field { padding-right: 54px; }
.unit span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 12.5px; color: var(--dim); pointer-events: none; }

/* routine editor */
.rdi { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.rdi:first-child { border-top: 0; }
.rdi > span { grid-column: 1 / -1; min-width: 0; font-weight: 500; }
.rdi .acts { grid-column: 3; }
.rdi .sel { min-height: 36px; padding-left: 12px; padding-right: 28px; background-position: right 11px center; font-size: 16px; }
.rdi .acts { display: flex; gap: 0; }
.rdi .iconbtn { width: 30px; height: 30px; font-size: 15px; }

/* records */
.prrow { display: block; width: 100%; padding: 11px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.prrow:first-of-type { border-top: 0; }
.prtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.prtop b { font-weight: 600; font-size: 15px; min-width: 0; }
.prtop span { font-size: 12.5px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prtop span strong { color: var(--text); font-weight: 650; font-size: 15px; }
.rms { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.rm { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--fill-2); font-variant-numeric: tabular-nums; color: var(--dim); }
.rm b { color: var(--text); font-weight: 650; }
.prnew { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.prnew:first-of-type { border-top: 0; }
.prnew span { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* reply dock on Progress: the message box sits right above the tab bar and the page fades out behind it */
.dock { box-shadow: 0 10px 30px rgba(0,0,0,.18); position: fixed; z-index: 19; left: 0; right: 0; margin: 0 auto; width: calc(100% - 28px); max-width: 520px; bottom: calc(max(env(safe-area-inset-bottom, 0px) - var(--gap), 0px) + 68px); border-radius: 26px; padding: 4px; background: var(--float); opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s var(--ease); }
.dock .cmp { margin: 0; }
.dock .cmp-p { padding: 8px 8px 2px; }
.dock .cmp-row { background: transparent; border: 0; }
.dockfade { position: fixed; z-index: 18; left: 0; right: 0; bottom: calc(-1 * var(--gap)); height: calc(env(safe-area-inset-bottom, 0px) + var(--gap) + 190px); pointer-events: none; opacity: 0; transition: opacity .25s;
  background: linear-gradient(to top, var(--bg) 0%, color-mix(in srgb, var(--bg) 88%, transparent) 45%, transparent); }
body.on-dock .dock { pointer-events: auto; }
body.set-open .dock, body.set-open .dockfade, body.sheet-open .dock, body.sheet-open .dockfade { opacity: 0 !important; pointer-events: none; }
body.kb .dockfade { opacity: 0 !important; }
#v-today .vin { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gap) + 170px); }
body.on-dock .toast { bottom: calc(max(env(safe-area-inset-bottom, 0px) - var(--gap), 0px) + 128px); }

/* progress and feedback */
.chart { margin-top: 12px; }
.chart svg { display: block; width: 100%; height: 104px; overflow: visible; }
.chart .cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; font-variant-numeric: tabular-nums; }
.report { font-size: 14.5px; line-height: 1.55; }
.report h3 { font-size: 15px; margin: 12px 0 3px; letter-spacing: -.01em; }
.report h3:first-child { margin-top: 0; }
.report p { margin: 0 0 8px; }
.fbmeta { font-size: 12px; color: var(--dim); margin: 0 0 8px; }
/* talking back to your coach: a thread under the message, a field and a camera button */
.thread { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.msg { max-width: 86%; align-self: flex-start; padding: 9px 12px; border-radius: 17px 17px 17px 5px; font-size: 14.5px; line-height: 1.45; background: var(--fill); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; border-radius: 17px 17px 5px 17px; background: color-mix(in srgb, var(--g1) 24%, var(--fill)); border-color: color-mix(in srgb, var(--g1) 40%, var(--line)); }
.msg small { display: block; margin-top: 3px; font-size: 11px; color: var(--dim); }
.msg .ph { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.ph img, .cmp-p img { width: 84px; height: 84px; object-fit: cover; border-radius: 11px; background: var(--fill-2); display: block; }
.waiting { align-self: flex-end; font-size: 11.5px; color: var(--dim); margin-bottom: -3px; }
/* one rounded bar: camera on the left, the text in the middle, send on the right, all on the same line */
.cmp { margin-top: 12px; }
.cmp-row { display: flex; gap: 2px; align-items: flex-end; padding: 4px; border-radius: 24px; background: var(--fill); border: 1px solid var(--line); }
.cmp textarea.field { flex: 1; min-width: 0; min-height: 36px; height: 36px; padding: 7px 6px; border: 0; border-radius: 0; background: transparent; resize: none; overflow: hidden; line-height: 22px; }
.cmp textarea.field:focus, .cmp textarea.field:focus-visible { outline: none; box-shadow: none; }
.cmp-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 0; background: transparent; color: var(--dim); cursor: pointer; transition: transform .3s var(--spring), opacity .2s; }
.cmp-btn:active { transform: scale(.9); }
.cmp-btn svg { width: 20px; height: 20px; }
.cmp-btn.send { background: var(--accent-grad); color: var(--on-grad); }
.flatbtn .cmp-btn.send { background: var(--g1); }
.cmp-row:has(textarea:placeholder-shown) .cmp-btn.send { opacity: .45; }
.cmp:has(.pv) .cmp-row .cmp-btn.send { opacity: 1; }
.cmp-btn input { display: none; }
.cmp-p { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.cmp-p:empty { display: none; }
.cmp-p .pv { position: relative; }
.cmp-p .pv button { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font-size: 13px; line-height: 1; display: grid; place-items: center; }

/* your coach on Today */
.av { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-grad); color: var(--on-grad); display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; }
.flatbtn .av, .flatbtn .claude i { background: var(--g1); }
/* the coach's own face, cut from the portrait */
.av.av-face, .flatbtn .av.av-face { background-color: color-mix(in srgb, var(--g1) 14%, var(--fill)); background-repeat: no-repeat; box-shadow: inset 0 0 0 1px var(--line); }
.coach-top { display: flex; align-items: center; gap: 10px; }
.coach-top h2 { flex: 1; min-width: 0; }
.coach-top .chip { min-height: 30px; padding: 0 11px; font-size: 13px; }
.coach .report { margin-top: 10px; }
.coach .fbmeta { margin: 8px 0 0; }
/* Purple, the mascot, hides behind the Coach Claude card with his hands on its edge and peeks at you now and then.
   Head, cap and the backs of his hands sit in a box that ends at the card's edge, so they vanish behind it; his fingers
   hang over the front. They are moved by springs in purpleTick, not by transitions, so he stretches, squashes and wobbles. */
.pp { position: relative; z-index: 2; height: 58px; margin-top: -14px; pointer-events: none; }
#notice:not([hidden]) ~ .pp, #connect:not([hidden]) ~ .pp { margin-top: 0; }
.pp-g { position: absolute; right: 24px; top: 0; width: 96px; height: 68px; }
.pp-clip { position: absolute; left: -20px; right: -20px; top: -70px; height: 128px; overflow: hidden; }
.pp-head, .pp-cap { position: absolute; left: 38px; top: 73.5px; width: 62.8px; height: 63.6px; transform-origin: 55% 86%; will-change: transform; }
.pp-cap { transform-origin: 50% 40%; }
.pp-ht { position: absolute; top: 122px; width: 22px; height: 6px; will-change: transform; }
.pp-ht.l { left: 28px; } .pp-ht.r { left: 86px; }
.pp-f { position: absolute; top: 58px; width: 22px; height: 10px; transform-origin: 50% 0; will-change: transform; }
.pp-f.l { left: 8px; } .pp-f.r { left: 66px; }
.pp img { display: block; width: 100%; height: 100%; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
.pp-tap { position: absolute; left: 0; top: 0; width: 96px; height: 68px; padding: 0; border: 0; border-radius: 14px; background: none; pointer-events: auto; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
.chat { display: flex; flex-direction: column; margin: 0 2px 12px; }
.chat .thread { margin-top: 0; }
.msg.plan { max-width: 92%; background: color-mix(in srgb, var(--g1) 10%, var(--glass)); border-color: color-mix(in srgb, var(--g1) 30%, var(--line)); margin-bottom: 8px; }
.msg.plan b { display: block; font-size: 12px; color: var(--g1); font-weight: 700; letter-spacing: .02em; margin-bottom: 2px; }
.msg.plan .chip { display: flex; width: max-content; margin-top: 9px; background: var(--g1); color: #fff; border-color: transparent; }
.nx { margin-top: 8px; }
.nxr { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.nxr:first-child { border-top: 0; }
.nxr span { min-width: 0; }
.nxr small { flex: none; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
button.day { font: inherit; color: inherit; cursor: pointer; transition: transform .3s var(--spring); }
button.day:active { transform: scale(.94); }
#week .gbar { margin-top: 10px; height: 6px; }
.lift .lnum { flex: none; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.lift .lnum small { font-size: 11px; color: var(--dim); }
/* the red count on a tab and on the gear, like other apps */
.nbadge { position: absolute; top: 1px; left: calc(50% + 4px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: #ff3b30; color: #fff; font: 700 10.5px/17px var(--font); font-style: normal; text-align: center; box-shadow: 0 0 0 2px var(--float); }
#setBtn .nbadge { top: -2px; left: auto; right: -2px; }
.set-nav button { position: relative; }
.set-nav button .ndot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; margin-left: 5px; vertical-align: 2px; }

/* body map: one figure seen from the front and the back, muscles shaded by how much work they got */
.bodymap { display: flex; align-items: stretch; gap: 14px; margin-top: 8px; height: 250px; }
.vin.fit .bodymap { flex: 1 1 auto; height: auto; min-height: 165px; max-height: 340px; }
.fig3d { flex: 0 0 46%; min-width: 0; display: flex; perspective: 900px; touch-action: pan-y; cursor: grab; }
.flip { position: relative; flex: 1; transform-style: preserve-3d; transition: transform .9s var(--spring); }
.flip.back { transform: rotateY(180deg); }
.flip.hello { animation: figHello 1.4s var(--ease); }
@keyframes figHello { 35% { transform: rotateY(-38deg); } 70% { transform: rotateY(12deg); } }
.fig3d.dragging .flip { transition: none; }
.face { position: absolute; inset: 0; display: flex; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.b { transform: rotateY(180deg); }
.face svg { display: block; height: 100%; width: auto; max-width: 100%; overflow: visible; }
.mside { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
.mside .sg { width: 100%; display: grid; }
.mlist { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; }
.mrow { display: block; width: 100%; padding: 4px 2px; border: 0; background: none; text-align: left; border-radius: 10px; }
.mrow:active { background: var(--fill); }
.mrow span { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.mrow b { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow small { flex: none; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.mrow i { display: block; height: 4px; border-radius: 2px; background: var(--fill-2); margin-top: 5px; overflow: hidden; }
.mrow em { display: block; height: 100%; border-radius: inherit; background: var(--g1); }
.bodymap .mu { stroke: var(--bg); stroke-width: 1.3; stroke-linejoin: round; transition: fill .5s var(--ease); cursor: pointer; }
.bodymap .nt { fill: var(--fill-2); stroke: var(--bg); stroke-width: 1.3; }
.bodymap .sil { fill: var(--fill-2); }
.bodymap .mu:active { opacity: .75; }
.bodymap .mu.hot { animation: muHot 2.6s ease-in-out infinite; }
@keyframes muHot { 50% { filter: brightness(1.18); } }
.bodymap .mu.pick { stroke: var(--text); stroke-width: 2.2; }
.heat { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11.5px; color: var(--dim); }
.heat i { flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--fill-2), color-mix(in srgb, var(--g1) 55%, var(--fill-2)), var(--g1)); }
.guide { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.guide h3 { margin: 0; font-size: 13px; color: var(--dim); font-weight: 650; letter-spacing: .02em; }
.guide p { margin: 0; font-size: 13.5px; line-height: 1.4; padding-left: 16px; position: relative; }
.guide p::before { content: ''; position: absolute; left: 2px; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--g1); }

/* smooth line charts with a soft fill; drag a finger along one to read each point */
.curve { position: relative; margin-top: 12px; touch-action: pan-y; }
.curve svg { display: block; width: 100%; overflow: visible; }
.curve .cdot { position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--g1); box-shadow: 0 0 0 3px var(--bg); pointer-events: none; transition: left .12s, top .12s; }
.curve .ctip { position: absolute; top: -6px; transform: translate(-50%, -100%); padding: 4px 9px; border-radius: 9px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; font-variant-numeric: tabular-nums; }
.curve.reading .ctip { opacity: 1; }
.curve .cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; font-variant-numeric: tabular-nums; }
.curve.empty { padding: 18px 0 6px; text-align: center; color: var(--dim); font-size: 13.5px; display: flex; align-items: center; justify-content: center; }
.curve.one { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 0 6px; text-align: center; }
.curve.one i { width: 13px; height: 13px; border-radius: 50%; background: var(--g1); box-shadow: 0 0 0 6px color-mix(in srgb, var(--g1) 18%, transparent); margin-bottom: 10px; }
.curve.one b { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.curve.one small { color: var(--dim); font-size: 12.5px; }
.curve .cgoal { position: absolute; left: 0; transform: translateY(-100%); padding: 0 2px 2px; font-size: 11px; font-weight: 650; color: var(--up); white-space: nowrap; pointer-events: none; }

/* key lifts: a short list, each one opens into a chart */
.lift { border-top: 1px solid var(--line); }
.lift:first-of-type { border-top: 0; }
.lift > button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 0; border: 0; background: none; text-align: left; }
.lift > button > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lift > button b { font-weight: 600; font-size: 15px; }
.lift > button small { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.lift > button strong { font-size: 17px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lift .spark { flex: none; width: 54px; height: 22px; }
.lift .chev2 { flex: none; color: var(--dim); transition: transform .3s var(--ease); }
.lift.open .chev2 { transform: rotate(90deg); }
.lift .lbody { padding: 0 0 14px; animation: panelIn .4s var(--ease); }
.lift .lbody .sg { width: 100%; display: grid; }
.prline { margin-top: 10px; font-size: 13px; color: var(--dim); }
.prline b { color: var(--text); font-weight: 600; }

/* goals */
.goal { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 11px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.goal:first-of-type { border-top: 0; }
.goal .gn { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--g1); color: var(--g1); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; margin-top: 1px; }
.goal > span { flex: 1; min-width: 0; }
.goal b { display: block; font-weight: 600; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.goal small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }
.gbar { height: 5px; border-radius: 3px; background: var(--fill-2); overflow: hidden; margin-top: 7px; }
.gbar i { display: block; height: 100%; background: var(--g1); border-radius: inherit; transition: width .6s var(--ease); }
.gprog { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.gprog .gbar, .gall .gbar { flex: 1; margin: 0; }
.gprog em, .gall em { flex: none; min-width: 36px; text-align: right; font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--g1); font-variant-numeric: tabular-nums; }
.gall { display: flex; align-items: center; gap: 10px; padding: 11px 0 2px; border-top: 1px solid var(--line); font-size: 13.5px; font-weight: 650; }
.gall .gbar { height: 8px; border-radius: 4px; }

/* reps in reserve: six buttons in a row instead of a slider */
.rir { margin-top: 10px; }
.rir .lab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.rir-b { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.rir-b button { min-width: 0; height: 40px; border-radius: 13px; border: 1px solid var(--line); background: var(--fill); font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; transition: transform .3s var(--spring), background .2s, color .2s; }
.rir-b button:active { transform: scale(.92); }
.rir-b button[aria-pressed="true"] { background: var(--accent-grad); color: var(--on-grad); border-color: transparent; }
.flatbtn .rir-b button[aria-pressed="true"] { background: var(--g1); }
.steppers.two-up { grid-template-columns: 1fr 1fr; }

/* delete next to Swap */
.ex-acts .ib { width: 34px; height: 34px; background: var(--fill); border: 1px solid var(--line); color: var(--dim); transition: background .2s, color .2s, width .3s var(--ease); }
/* the note bubble: filled once the exercise has a rating or note today, a dot when there are notes from earlier */
.ex-acts .ib.nb { position: relative; }
.ex-acts .ib.nb.on { background: color-mix(in srgb, var(--g1) 16%, var(--fill)); border-color: color-mix(in srgb, var(--g1) 45%, var(--line)); color: var(--g1); }
.ex-acts .ib.nb.on svg { fill: color-mix(in srgb, var(--g1) 30%, transparent); }
.ib.nb .nbd { position: absolute; top: 1px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--g1); box-shadow: 0 0 0 2px var(--bg); }
/* the notes sheet, and Settings, Notes */
.npl { display: flex; flex-direction: column; gap: 6px; }
.npl .npi { max-width: none; }
.sheet-body .feel { margin-top: 0; }
.ntg { margin: 16px 2px 0; }
.ntg h3 { margin: 0 4px 7px; font-size: 15px; font-weight: 650; }
.nti { padding: 9px 12px; border-radius: 14px; background: var(--fill); border: 1px solid var(--line); margin-bottom: 6px; }
.nti small { display: block; color: var(--dim); font-size: 12px; font-weight: 600; }
.nti small b { color: var(--g1); font-weight: 650; }
.nti p { margin: 2px 0 0; font-size: 14px; line-height: 1.4; }
.ex-acts .ib.armed { width: auto; padding: 0 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }

/* sliders: a ruler. A fine tick for each step and taller ones at round numbers, a soft fill up to a slim accent handle,
   and the value grows while you drag. Drag down while you slide for finer steps. */
.rng { --tk1: color-mix(in srgb, var(--text) 18%, transparent); --tk2: color-mix(in srgb, var(--text) 40%, transparent); }
.rng::-webkit-slider-runnable-track { height: 34px; border-radius: 11px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--g1) 6%, transparent), color-mix(in srgb, var(--g1) 30%, transparent)) 0 0 / var(--pw, 0px) 100% no-repeat,
    linear-gradient(90deg, var(--tk2) 0 1.5px, transparent 1.5px) var(--mo2, 0) 50% / var(--ma, 40px) 16px repeat-x,
    linear-gradient(90deg, var(--tk1) 0 1px, transparent 1px) var(--mo1, 0) 50% / var(--mi, 8px) 8px repeat-x,
    var(--fill); }
.rng::-webkit-slider-thumb { width: 6px; height: 34px; margin-top: 0; border-radius: 3px; background: var(--g1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--g1) 22%, transparent), 0 2px 8px rgba(0,0,0,.2); transition: transform .25s var(--spring), box-shadow .25s; }
.stp.drag .rng::-webkit-slider-thumb { transform: scaleY(1.14); box-shadow: 0 0 0 7px color-mix(in srgb, var(--g1) 18%, transparent), 0 4px 14px rgba(0,0,0,.24); }
.rng::-moz-range-track { height: 34px; border-radius: 11px; background: var(--fill); }
.rng::-moz-range-progress { height: 34px; border-radius: 11px; background: color-mix(in srgb, var(--g1) 22%, transparent); }
.rng::-moz-range-thumb { width: 6px; height: 34px; border-radius: 3px; background: var(--g1); box-shadow: none; }

/* cardio and warm-up cards: a timer with big digits, a round start button and a thin bar */
/* the rest on each exercise card: waiting with the planned time until you log a set, then counting with a bar */
.rst { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; grid-template-areas: "l t b x" "bar bar bar bar"; align-items: center; column-gap: 8px; row-gap: 10px; margin-top: 12px; padding: 10px 10px 12px 16px; border-radius: 20px; background: var(--fill); border: 1px solid var(--line); }
.rst.idle { row-gap: 0; padding-bottom: 10px; }
.rst-l { grid-area: l; display: flex; flex-direction: column; min-width: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); line-height: 1.25; }
.rst-l span { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rst-t { grid-area: t; font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; padding: 1px 9px; border-radius: 999px; line-height: 1.2; transition: background .3s, color .3s; }
.rst-t small { font-size: 13px; font-weight: 600; color: var(--dim); margin-left: 3px; letter-spacing: 0; }
.rst.idle .rst-t { color: var(--dim); font-size: 22px; }
.rst.over .rst-t { background: var(--accent-grad); color: var(--on-grad); }
.rst.over .rst-t small { color: inherit; opacity: .8; }
.rst > .ib { width: 38px; height: 38px; background: var(--fill-2); color: var(--text); }
.rst > .ib[data-a="sound"] { grid-area: b; }
.rst > .ib[data-a="rest-close"] { grid-area: x; }
.rst > .ib svg { width: 17px; height: 17px; }
.rst-bar { grid-area: bar; height: 5px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.rst-bar i { display: block; height: 100%; width: 0; background: var(--accent-grad); transition: width .5s linear; }
.rst.idle .rst-bar { display: none; }
.ex.tight .rst { margin-top: 8px; padding-top: 7px; padding-bottom: 9px; }
.ex.snug .rst.idle .rst-l span { display: none; }
.ex.tight .rst.idle { padding-top: 4px; padding-bottom: 4px; }
.ex.tight .rst > .ib { width: 34px; height: 34px; }
.ex.tight .rst-t { font-size: 22px; }
.ctm { display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: "t x go" "bar bar bar"; align-items: center; column-gap: 10px; row-gap: 12px; margin-top: 12px; padding: 14px 14px 14px 18px; border-radius: 20px; background: var(--fill); border: 1px solid var(--line); }
.ctm-l { grid-area: t; display: flex; flex-direction: column; min-width: 0; }
.ctm-l b { font-size: 46px; line-height: 1; font-weight: 600; letter-spacing: -.035em; font-variant-numeric: tabular-nums; transition: color .3s; }
.ctm-l small { margin-top: 6px; font-size: 12.5px; color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
.ctm.over .ctm-l b { color: var(--g1); }
.ctm-go { grid-area: go; width: 58px; height: 58px; border-radius: 50%; border: 0; padding: 0; background: var(--g1); color: #fff; display: grid; place-items: center; transition: transform .3s var(--spring); }
.ctm-go:active { transform: scale(.9); }
.ctm-go svg { width: 24px; height: 24px; fill: currentColor; }
.ctm-go[data-run="false"] svg { margin-left: 3px; }
.ctm.run .ctm-go { background: var(--fill-2); color: var(--text); }
.ctm-x { grid-area: x; width: 42px; height: 42px; border-radius: 50%; border: 0; padding: 0; background: var(--fill-2); color: var(--text); display: grid; place-items: center; }
.ctm-x svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ctm-bar { grid-area: bar; height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; }
.ctm-bar i { display: block; height: 100%; width: 0; background: var(--g1); border-radius: inherit; transition: width .5s linear; }
.warm .last { margin-top: 10px; }
.pace { margin: 8px 4px 0; font-size: 13px; color: var(--dim); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.pace:empty { display: none; }
.cic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
/* the cardio sheet: the machines in order with their minutes, and chips to add more */
.cpl { display: flex; flex-direction: column; }
.cpr { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.cpr:first-child { border-top: 0; padding-top: 2px; }
.cpr > b { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; }
.cpi { width: 38px; height: 38px; border-radius: 12px; background: var(--fill); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.cpi .cic { width: 21px; height: 21px; }
.cpm { display: flex; align-items: center; gap: 2px; background: var(--fill); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.cpm button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; font-size: 19px; line-height: 1; color: var(--text); padding: 0; }
.cpm button:active { background: var(--fill-2); }
.cpm span { min-width: 54px; text-align: center; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
.cpr .ib { background: transparent; color: var(--dim); }
.cp-add { display: flex; flex-wrap: wrap; gap: 8px; }
.cp-add .cic { width: 16px; height: 16px; }
.nxc { display: inline-flex; align-items: center; gap: 8px; }
.steppers.slide .stp { position: relative; }
.steppers.slide .stp input:not(.rng), .steppers.slide .stp output { transition: transform .25s var(--spring), color .2s; transform-origin: right center; }
.steppers.slide .stp.drag input:not(.rng), .steppers.slide .stp.drag output { transform: scale(1.12); color: var(--g1); }
.scrub { position: absolute; left: 50%; top: -12px; transform: translate(-50%, -100%); padding: 5px 11px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 3; }
.scrub.on { opacity: 1; }

/* tips for beginners; experienced users never see them */
.hint { display: none; margin: 10px 0 0; padding: 9px 12px; border-radius: 14px; background: color-mix(in srgb, var(--g1) 9%, var(--fill)); font-size: 13px; line-height: 1.45; color: var(--dim); }
.hint b { color: var(--text); font-weight: 600; }
.lvl-new .hint { display: block; }

/* updates in settings, each change can be rated */
.upd { padding: 14px 6px 4px; }
.upd h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.upd h3 small { color: var(--dim); font-weight: 500; font-size: 12.5px; }
.uitem { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.uitem > span { min-width: 0; font-size: 14px; line-height: 1.4; }
.stars { display: flex; gap: 2px; flex: none; }
.stars button { width: 26px; height: 30px; padding: 0; border: 0; background: none; color: var(--fill-2); font-size: 19px; line-height: 1; transition: transform .3s var(--spring), color .15s; }
.stars button.on { color: var(--g1); }
.stars button:active { transform: scale(.85); }

/* exercise preferences: Love, Fine or Avoid per exercise, with an optional short reason */
.xp-bar { position: sticky; top: -2px; z-index: 2; margin: 0 -14px; padding: 12px 14px 10px; background: var(--glass); display: flex; flex-direction: column; gap: 10px; }
.xp-bar .sg { width: 100%; }
.xp-bar .sg button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.xp-bar .sg svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.xp-bar .sg em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.xp-grp > .lab { margin: 14px 6px 0; }
.xp { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 2px 4px 2px 6px; border-top: 1px solid var(--line); }
.xp-grp > .lab + .xp { border-top: 0; }
.xp-name { flex: 1 1 auto; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; border: 0; background: none; padding: 6px 0; text-align: left; }
.xp-name b { display: block; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .25s; }
.xp-name small { display: block; font-size: 12.5px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xp-name small:empty { display: none; }
.xp[data-p="love"] .xp-name small { color: var(--g1); }
.xp[data-p="avoid"] .xp-name b { color: var(--dim); }
.xp[data-p="avoid"] .xp-name small { color: var(--down); }
.xp.open .xp-name b { color: var(--text); }
.xp-seg { flex: none; position: relative; display: grid; grid-template-columns: repeat(3, 38px); padding: 3px; border-radius: 13px; background: var(--fill); }
.xp-seg::before { content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: 38px; border-radius: 10px; background: var(--drop); transform: translateX(calc(var(--i, 1) * 100%)); transition: transform .5s var(--spring), background .3s; }
.xp[data-p="love"] .xp-seg::before { background: var(--g1); }
.xp[data-p="avoid"] .xp-seg::before { background: var(--down); }
.xp-seg button { position: relative; height: 34px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--dim); transition: color .25s, transform .3s var(--spring); }
.xp-seg button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: fill .25s; }
.xp-seg button.on { color: var(--text); }
.xp[data-p="love"] .xp-seg button.on, .xp[data-p="avoid"] .xp-seg button.on { color: #fff; }
.xp[data-p="love"] .xp-seg button.on svg { fill: currentColor; }
.xp-seg button:active { transform: scale(.86); }
.xp-seg button.pop svg { animation: xpPop .5s var(--spring); }
@keyframes xpPop { 35% { transform: scale(1.4); } }
.xp-why { padding: 0 4px 14px 6px; animation: panelIn .4s var(--ease); }
.xp-why .field { height: 44px; }
.xp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.xp-chips button { border: 0; border-radius: 999px; padding: 7px 12px; background: var(--fill-2); font-size: 13px; transition: background .2s, color .2s, transform .3s var(--spring); }
.xp-chips button:active { transform: scale(.94); }
.xp-chips button.on { background: color-mix(in srgb, var(--g1) 18%, var(--fill)); color: var(--g1); font-weight: 600; }
.xp-empty { text-align: center; color: var(--dim); padding: 44px 16px; font-size: 14px; line-height: 1.5; }
.li small.love { color: var(--g1); }
.li small.avoid { color: var(--down); }

@media (prefers-reduced-motion: reduce) { .blob, .cards.deck-on .ex, .ovt, .ovw.editing .ovt, .bodymap .mu.hot { animation: none; } .par, .sheet, .settings, .tabbar { transition: none; } }
@media (prefers-reduced-transparency: reduce) { :root { --glass: color-mix(in srgb, var(--bg) 92%, transparent); } }
@media (max-width: 360px) { .stp input { font-size: 27px; } .tabbar { width: calc(100% - 24px); } .tabbar a { font-size: 9px; } }

<script>
/* Liquid Glass (liquid-glass.js from the starter kit). Changes: sheets drag only from the header and have onClose,
   and the tab bar has track(f) so the drop follows your finger while you swipe between pages. */
(function () {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // iPhone has no vibrate(), but since iOS 18 flipping a switch input gives a small tick, so a hidden one is flipped
  // instead. Its clicks stop at the label so the app never sees them. At most one tick per 30 ms while a slider runs.
  let hapEl = null, hapAt = 0;
  const haptic = () => {
    if (window.LiquidGlass && window.LiquidGlass.quiet) return;
    const now = performance.now(); if (now - hapAt < 30 || now - (window.LiquidGlass && window.LiquidGlass.tapAt || -1e9) < 400) return; hapAt = now;
    try {
      if (navigator.vibrate) { navigator.vibrate(8); return; }
      if (!hapEl) {
        hapEl = document.createElement('label'); hapEl.setAttribute('aria-hidden', 'true');
        hapEl.style.cssText = 'position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden';
        const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1;
        hapEl.append(i); hapEl.addEventListener('click', e => e.stopPropagation()); document.body.append(hapEl);
      }
      hapEl.click();
      if (document.activeElement === hapEl.firstChild) hapEl.firstChild.blur();   // the tick must not take the focus
    } catch (e) {}
  };
  function spring(x, k = 300, zeta = .75) { return { x, v: 0, t: x, k, zeta }; }
  function stepSpring(s, dt) { const a = s.k * (s.t - s.x) - 2 * Math.sqrt(s.k) * s.zeta * s.v; s.v += a * dt; s.x += s.v * dt; return Math.abs(s.t - s.x) > .05 || Math.abs(s.v) > .05; }
  function runLoop(springs, render) {
    let raf = 0, t0;
    const tick = t => { const dt = Math.min((t - t0) / 1000, 1 / 30); t0 = t; let moving = false; for (const s of springs) moving = stepSpring(s, dt) || moving; if (!moving) springs.forEach(s => { s.x = s.t; s.v = 0; }); render(); raf = moving ? requestAnimationFrame(tick) : 0; };
    return () => { if (!raf) { t0 = performance.now(); raf = requestAnimationFrame(tick); } };
  }
  function tabs(bar, { onChange } = {}) {
    const links = [...bar.querySelectorAll('a')];
    const drop = bar.querySelector('.drop');
    let current = Math.max(0, links.findIndex(a => a.classList.contains('on')));
    const L = spring(0), R = spring(0), lift = spring(1, 380, .55);
    const kick = runLoop([L, R, lift], () => {
      const speed = Math.abs(L.v) + Math.abs(R.v); const squash = Math.min(speed / 9000, .12);
      drop.style.width = (R.x - L.x) + 'px';
      drop.style.transform = `translate3d(${L.x}px,0,0) scale(${lift.x * (1 + squash * .4)}, ${lift.x * (1 - squash)})`;
    });
    function moveTo(el, instant) {
      const l = el.offsetLeft, r = l + el.offsetWidth;
      if (instant || reduceMotion) { L.x = L.t = l; R.x = R.t = r; L.v = R.v = 0; }
      else { const right = l > L.x; L.k = right ? 150 : 430; R.k = right ? 430 : 150; L.t = l; R.t = r; }
      kick();
    }

   or just this phone. Every change goes through one queue that survives bad reception. */
function savePending(){
  const v = JSON.stringify(S.pending);
  let ok = true;
  try{ localStorage.setItem('tl.pending.v1', v); }
  catch(e){
    // storage is full: the copy of the repo can be loaded again, so it goes first
    try{ localStorage.removeItem('tl.gh.cache'); localStorage.setItem('tl.pending.v1', v); }
    catch(x){ ok = false; }
  }

function queue(op, col, id, data){

    // only ever lived on the phone needs no delete: removing a meal frees its photo
    for(let i = S.pending.length - 1; i >= S.inflight; i--) if(S.pending[i].col === col && S.pending[i].id === id) S.pending.splice(i, 1);
    if(op !== 'set' && !(S.snap[col] && S.snap[col].has(id))){ savePending(); refresh(); return; }
  }
  else if(op === 'set'){
    for(let i = S.pending.length - 1; i >= S.inflight; i--){
      const p = S.pending[i];

const refFor = (col, id) => col === 'meta' ? base() : base().collection(col).doc(id);
async function dbFlush(){

function dbSubscribe(){
  const onErr = e => { console.warn('db', e); if(e && e.code === 'revoked') S.mode = 'local'; renderStatus(); };
  const order = {sessions:['startedAt',500], sets:['ts',1000], body:['date',300], checkins:['date',400], plans:['date',30]};
  for(const col of COLS){
    let q = base().collection(col);
    if(order[col]) q = q.orderBy(order[col][0], 'desc').limit(order[col][1]);

const GH = { cfg: loadJSON('tl.gh', null), head: null, branch: 'main', files: {}, index: {}, bad: new Set(), authError: false };
const GQL = 'https://api.github.com/graphql';
async function gql(query, variables, token){
  let res;

  catch(e){ throw {net:true}; }
  if(res.status === 401 || res.status === 403) throw {auth:true, status:res.status};
  if(!res.ok) throw {net:true, status:res.status};
  const j = await res.json();
  if(j.errors && j.errors.length) throw {gql:true, message: j.errors.map(e => e.message).join('; ')};
  return j.data;
}
const Q_LOAD = 'query($o:String!,$n:String!){repository(owner:$o,name:$n){defaultBranchRef{name target{oid}} object(expression:"HEAD:data"){... on Tree{entries{name type object{... on Blob{text isTruncated} ... on Tree{entries{name type object{... on Blob{text isTruncated}}}}}}}}}}';
const Q_HEAD = 'query($o:String!,$n:String!){repository(owner:$o,name:$n){name defaultBranchRef{target{oid}}}}';
