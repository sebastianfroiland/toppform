const FLAT = {meta:'data/meta.json', routines:'data/routines.json', folders:'data/folders.json', plans:'data/plans.json', requests:'data/requests.json', social:'data/social.json'};
function filesToSnap(){
  const snap = emptySnap();
  GH.index = {};
  for(const [path, obj] of Object.entries(GH.files)){
    if(!obj || typeof obj !== 'object') continue;
    if(path === FLAT.meta){ snap.meta.set('logg', obj); continue; }
    const flat = Object.keys(FLAT).find(k => FLAT[k] === path);
    const m = /^data\/([a-z]+)\/[^/]+\.json$/.exec(path);
    const col = flat || (m && m[1]);
    if(!col || !snap[col]) continue;
    for(const [id, doc] of Object.entries(obj)){ if(doc && typeof doc === 'object'){ snap[col].set(id, doc); GH.index[col + '/' + id] = path; } }
  }

      // a file that comes back cut off or broken is marked, so the app never writes over what it could not read
      const t = e.object && !e.object.isTruncated ? e.object.text : null;

const ghHeld = () => GH.bad.size ? S.pending.filter(op => op.col !== 'photos' && (GH.bad.has(ghPath(op)) || GH.bad.has(GH.index[op.col + '/' + op.id]))) : [];

  const ops = S.pending.slice(0, Math.min(40, S.pending.length - held.length));

      const path = ghPath(op);

function strengthPRsCalc(){
  const by = new Map();
  for(const x of D.sets){ if(!by.has(x.exercise)) by.set(x.exercise, []); by.get(x.exercise).push(x); }
  const out = [];
  for(const [name, xs] of by){
    const info = infoOf(name); let e1 = null, maxReps = null; const rms = {};
    for(const x of xs){
      const sc = score(x.weight||0, x.reps||0, info); if(!e1 || sc > e1.sc) e1 = {sc, x};
      for(const n of RMS){ if((x.reps||0) < n) continue; const cur = rms[n], w = x.weight||0;
        if(!cur || (info.bw === 'assist' ? w < (cur.weight||0) : w > (cur.weight||0)) || (w === (cur.weight||0) && x.reps > cur.reps)) rms[n] = x; }
      if(info.bw && !(x.weight > 0) && (!maxReps || x.reps > maxReps.reps)) maxReps = x;
    }
    out.push({name, info, e1, rms, maxReps, last: D.lastUsed.get(name) || 0});
  }
  return out;
}
function prEvents(days){
  const asc = D.sets.slice().sort((a,b) => a.ts - b.ts), best = new Map(), ev = [], from = addDays(todayISO(), -days);

    if((b == null || sc > b + 1e-9) && x.date >= from) ev.push(x);
    if(b == null || sc > b) best.set(x.exercise, sc); }

function cardioPRs(){

      const p1 = best(1000), p5 = best(5000), p10 = best(10000);

    }

/* ---------- charts ----------
   Smooth curves (monotone, so they never bulge past a real value), a clean line without a fill, and a dot on the
   latest point. Drag a finger along a chart to read every point. */
function smoothPath(P){
  const n = P.length, f = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  if(n < 2) return '';
  if(n === 2) return 'M' + f(P[0]) + 'L' + f(P[1]);
  const dx = [], m = [], t = [];
  for(let i = 0; i < n - 1; i++){ dx[i] = P[i + 1][0] - P[i][0]; m[i] = (P[i + 1][1] - P[i][1]) / (dx[i] || 1e-6); }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for(let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for(let i = 0; i < n - 1; i++){
    if(m[i] === 0){ t[i] = t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if(s > 9){ const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = 'M' + f(P[0]);
  for(let i = 0; i < n - 1; i++){ const h = dx[i] / 3; d += 'C' + f([P[i][0] + h, P[i][1] + t[i] * h]) + ' ' + f([P[i + 1][0] - h, P[i + 1][1] - t[i + 1] * h]) + ' ' + f(P[i + 1]); }
  return d;
}
/* o.goal {y, label} draws a dashed goal line when the goal is near enough to keep the curve readable, and o.inv puts

function curveHtml(pts, o){

    '<i class="cdot" style="left:' + data[data.length - 1][0] + '%;top:' + data[data.length - 1][1] + 'px"></i><span class="ctip"></span>' + (near ? '<span class="cgoal" style="top:' + gy + 'px">' + esc(g.label) + '</span>' : '') +
    '<div class="cap"><span>' + esc(dDay(pts[0].x)) + '</span><span>' + esc(fy(lo) + (lo === hi ? '' : ' to ' + fy(hi)) + (o.unit || '')) + '</span><span>' + esc(dDay(pts[pts.length - 1].x)) + '</span></div></div>';

function saveGoal(id){

  let auto = '';
  if(t === 'strength'){ f.lift = $('#g-lift').value || null; const v = num($('#g-target').value), r = Math.round(num($('#g-reps').value) || 0); f.target = v && v > 0 ? v : null; f.reps = r > 1 ? r : null;
    if(f.lift && f.target) auto = f.lift + (f.reps ? ' ' + fmt(f.target) + ' kg for ' + f.reps + ' reps' : ' 1RM of ' + fmt(f.target) + ' kg'); else if(f.lift && f.reps) auto = f.lift + ', ' + f.reps + ' reps in one set'; }
  else if(t === 'endurance'){ f.act = $('#g-act').value; const km = num($('#g-dist').value); f.distM = km && km > 0 ? Math.round(km * 1000) : null; f.timeSec = parseDur($('#g-time').value) || null; if(f.distM) auto = f.act + ' ' + fmt(km) + ' km' + (f.timeSec ? ' in under ' + mmss(f.timeSec) : ''); }

  const text = (raw || auto).replace(/^./, c => c.toUpperCase()).slice(0, 200);
  if(!text){ toast('Write the goal first'); $('#g-text').focus(); return; }
  const list = goals(), old = id ? list.find(x => x.id === id) : null;
  if(!old && list.length >= 3){ toast('Three goals at a time'); return; }
  if(old && old.type === t && t === 'health' && old.metric === f.metric && old.from != null) f.from = old.from;
  const g = Object.assign({}, old || {id: newId(), createdAt: Date.now()}, f, {text, date: todayISO()});
  for(const k of Object.keys(f)) if(g[k] == null) delete g[k];
  if(!old || old.text !== text) delete g.formal;
  saveMeta({goals: old ? list.map(x => x.id === id ? g : x) : list.concat([g])});
  closeSheet(); toast(old ? 'Goal saved' : 'Goal added');
}

/* Records: only the key lifts (your goals first, then the compound lifts you do most). Each one opens into a chart
   of the lift over time, its volume, or how much stronger you are across all lifts. Everything else is under All lifts. */
function liftSeries(name){
  const info = infoOf(name), by = new Map();
  const reps = info.bw && !D.sets.some(x => x.exercise === name && x.weight > 0);
  for(const x of D.sets){
    if(x.exercise !== name) continue;
    // one point a day, so two workouts on the same day never draw a flat line between them
    const y = reps ? x.reps || 0 : score(x.weight || 0, x.reps || 0, info), v = by.get(x.date) || {x: x.date, y: 0, vol: 0, ts: x.ts};
    v.y = Math.max(v.y, y); v.vol += reps ? x.reps || 0 : (x.weight || 0) * (x.reps || 0); v.ts = Math.min(v.ts, x.ts); by.set(x.date, v);
  }
  const list = [...by.values()].sort((a, b) => a.ts - b.ts);
  return {reps, e1: list.map(v => ({x: v.x, y: reps ? v.y : Math.round(v.y * 2) / 2})), vol: list.map(v => ({x: v.x, y: v.vol}))};
}
function strengthIndex(){
  const asc = D.sets.slice().sort((a, b) => a.ts - b.ts), first = new Map(), best = new Map(), out = [];
  for(const x of asc){
    const info = infoOf(x.exercise); if(info.bw && !(x.weight > 0)) continue;
    const sc = score(x.weight || 0, x.reps || 0, info); if(!(sc > 0)) continue;
    if(!first.has(x.exercise)) first.set(x.exercise, sc);
    if(!best.has(x.exercise) || sc > best.get(x.exercise)) best.set(x.exercise, sc);
    let sum = 0; for(const [k, v] of best) sum += v / first.get(k);
    const y = Math.round((sum / best.size - 1) * 1000) / 10;
    if(out.length && out[out.length - 1].x === x.date) out[out.length - 1].y = y; else out.push({x: x.date, y});
  }
  return out;
}
function keyLifts(n){
  const count = new Map();
  for(const x of D.sets){ if(!count.has(x.exercise)) count.set(x.exercise, new Set()); count.get(x.exercise).add(x.sessionId); }
  const prs = strengthPRs(), gl = goals().map(g => g.lift).filter(Boolean);
  const rank = p => (gl.includes(p.name) ? 1e6 : 0) + (p.info.kind === 'b' ? 1e4 : 0) + count.get(p.name).size * 100 + Math.min(99, p.e1.sc / 4);
  return prs.slice().sort((a, b) => rank(b) - rank(a)).slice(0, n || Math.max(4, gl.length));
}

    (rows ? '<div style="margin-top:4px">' + rows + '</div>' : '<p class="sub" style="margin-top:8px">Log your first sets and your key lifts show up here.</p>'));

// Photos in a private repo need the token, so they are fetched once and kept as local links
async function hydratePhotos(){
  if(S.backend !== 'gh' || !GH.cfg) return;
  for(const img of document.querySelectorAll('img[data-ph]')){
    const path = img.dataset.ph; img.removeAttribute('data-ph');
    try{
      if(!photoCache[path]){
        const r = await fetch('https://api.github.com/repos/' + GH.cfg.owner + '/' + GH.cfg.repo + '/contents/' + path, {headers: {Authorization: 'bearer ' + GH.cfg.token, Accept: 'application/vnd.github.raw+json'}});
        if(!r.ok) continue;
        photoCache[path] = URL.createObjectURL(await r.blob());
      }
      img.src = photoCache[path];
    }catch(e){}
  }
}
function shrinkPhoto(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

function buildSummary(r){
  const st = ST(), lines = [];
  lines.push('User: ' + (st.name || 'unknown') + '. Plan start ' + (st.start || 'not set') + (st.weeks ? ', ' + st.weeks + ' weeks' : '') + ', goal ' + (st.goal || 3) + ' strength sessions a week. Period ' + r.from + ' to ' + r.to + '.');
  lines.push('Method: 1 to 2 hard working sets. reps = full reps, N RIR = reps left in reserve, +N = partial reps after failure (older entries). BW = bodyweight.');
  const gs = goals(); if(gs.length) lines.push('Goals: ' + gs.map((g, i) => (i + 1) + '. ' + (g.formal || g.text) + (g.lift && g.target ? ' (' + g.lift + ' 1RM ' + g.target + ' kg)' : '')).join(' '));
  lines.push('\nSESSIONS');
  for(const s of D.sessions.filter(s => s.date >= r.from && s.date <= r.to).slice().sort((a,b) => a.startedAt - b.startedAt)){
    if(s.kind === 'styrke'){
      const xs = setsOf(s.id); if(!xs.length) continue;
      const by = {}; xs.slice().sort((a,b) => a.ts - b.ts).forEach(x => { (by[x.exercise] = by[x.exercise] || []).push(setText(x, infoOf(x.exercise))); });
      const swaps = (s.exercises || []).filter(e => e.from).map(e => e.from + ' -> ' + e.name);
      const exNotes = (s.exercises || []).filter(e => (e.note && e.note.trim()) || e.setup || e.feel).map(e => e.name + ': ' + [e.feel ? 'felt ' + (FEEL.find(f => f[0] === e.feel) || [, e.feel])[1].toLowerCase() : '', e.setup ? 'setup ' + e.setup.replace(/\s+/g, ' ').slice(0, 80) : '', e.note ? e.note.replace(/\s+/g, ' ').slice(0, 120) : ''].filter(Boolean).join(', '));
      const warms = (s.exercises || []).filter(e => e.warm && e.log).map(e => e.name + ' ' + warmText(e));
      const skips = (s.exercises || []).filter(e => e.skip).map(e => e.name + [e.skip.reason, e.skip.note].filter(Boolean).map(x => ' (' + x.replace(/\s+/g, ' ').slice(0, 120) + ')').join(''));
      lines.push(s.date + ' ' + sessionTitle(s) + ': ' + Object.keys(by).map(k => k + ' ' + by[k].join(', ')).join('; ') + (s.knee ? ' | knee/foot ' + s.knee : '') + (s.rpe ? ' | effort ' + s.rpe : '') + (swaps.length ? ' | swapped ' + swaps.join(', ') : '') + (exNotes.length ? ' | exercise notes: ' + exNotes.join('; ') : '') + (warms.length ? ' | warm-up ' + warms.join(', ') : '') + (skips.length ? ' | skipped ' + skips.join(', ') : '') + (s.note ? ' | note: ' + s.note.replace(/\s+/g, ' ').slice(0, 200) : ''));
    } else if(isCardioS(s)) lines.push(s.date + ' Cardio workout: ' + (s.exercises || []).map(e => e.name + ' ' + (e.skip ? 'skipped' + (e.skip.reason ? ' (' + e.skip.reason + ')' : '') : e.log ? warmText(e) : 'not done') + (e.note ? ' (note: ' + e.note.replace(/\s+/g, ' ').slice(0, 100) + ')' : '')).join('; ') + (s.rpe ? ' | effort ' + s.rpe : '') + (s.note ? ' | note: ' + s.note.replace(/\s+/g, ' ').slice(0, 160) : ''));
    else lines.push(s.date + ' ' + s.activity + ': ' + sessionMeta(s) + (s.knee ? ' | knee/foot ' + s.knee : '') + (s.note ? ' | note: ' + s.note.replace(/\s+/g, ' ').slice(0, 160) : ''));
  }
  const cis = [...D.checkins.values()].filter(c => c && c.date >= r.from && c.date <= r.to).sort((a,b) => a.date < b.date ? -1 : 1);
  if(cis.length){ lines.push('\nCHECK-INS'); for(const c of cis) lines.push(c.date + ': ' + [c.kg ? c.kg + ' kg' : '', c.sleep ? c.sleep + ' h sleep' : '', c.energy ? 'energy ' + c.energy + '/5' : '', c.sore ? 'sore ' + c.sore : '', c.knee ? 'knee/foot ' + c.knee : '', c.note ? 'note: ' + c.note.replace(/\s+/g, ' ').slice(0, 120) : ''].filter(Boolean).join(', ')); }
  const ev = prEvents(400).filter(x => x.date >= r.from && x.date <= r.to);
  if(ev.length){ lines.push('\nNEW RECORDS'); ev.slice(0, 20).forEach(x => lines.push(x.date + ' ' + x.exercise + ' ' + setText(x, infoOf(x.exercise)))); }
  return lines.join('\n').slice(0, 60000);
}

let actx = null;
function ensureAudio(){ if(!ST().sound) return; try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); }catch(e){} }
function beep(){
  if(!ST().sound || !actx) return;
  try{ const t = actx.currentTime; [0, .28].forEach(off => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, t+off); g.gain.exponentialRampToValueAtTime(.25, t+off+.02); g.gain.exponentialRampToValueAtTime(.0001, t+off+.2); o.connect(g); g.connect(actx.destination); o.start(t+off); o.stop(t+off+.22); }); }catch(e){}
}

function tickRest(){

   notification that stands in for one: posted the moment you lock the phone or switch app during a workout, and
   cleared when you come back, finish or discard. A locked phone pauses web apps, so the card shows the workout as it

const LC_TAG = 'workout';

function lockCardText(s){
  const xs = (s.exercises || []).filter(e => !e.warm), sets = setsOf(s.id);
  let done = 0, total = 0, exDone = 0, next = '';
  for(const e of xs){
    const n = isCardioS(s) ? (e.log ? 1 : 0) : sets.filter(x => x.exercise === e.name).length;
    // Free sets count as three until you log more
    const plan = isCardioS(s) ? 1 : e.skip ? n : (+e.planned || Math.max(n, 3));
    done += Math.min(n, plan); total += plan;
    if(e.skip || n >= plan) exDone++; else if(!next) next = e.name;
  }
  const pct = total ? Math.round(done / total * 100) : 0, cells = Math.round(pct / 10);
  const min = Math.max(0, Math.round((Date.now() - (s.startedAt || Date.now())) / 60000));
  const r = S.ui.rest, restEnd = r && !isCardioS(s) ? r.start + r.target * 1000 : 0;
  const lines = [
    (isCardioS(s) ? '' : plural(sets.length, 'set') + ' · ') + exDone + ' of ' + xs.length + ' ' + (isCardioS(s) ? 'machine' : 'exercise') + (xs.length === 1 ? '' : 's'),
    restEnd > Date.now() ? 'Next set at ' + fClock.format(restEnd) + (next ? ' · ' + next : '') : next ? 'Up next · ' + next : xs.length ? 'All done · tap to finish' : 'Add your first exercise',
    '▰'.repeat(cells) + '▱'.repeat(10 - cells) + '  ' + pct + '%'
  ];
  return {title: (s.title || 'Workout') + ' · ' + (min < 60 ? min + ' min' : Math.floor(min / 60) + ' h ' + (min % 60) + ' min'), body: lines.join('\n')};
}

const XP_KEYS = ['love', 'fine', 'avoid'];
const XP_NAME = {love: 'Love', fine: 'Fine', avoid: 'Avoid'};
const XP_ICON = {
  love: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>',
  fine: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.5 3.6 3.6 7.4-8"/></svg>',
  avoid: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m6.5 6.5 11 11"/></svg>'
};
const XP_WHY = {
  love: ['Feels great', 'Great pump', 'Easy to set up', 'Strong on it'],

  avoid: ['Machine often taken', 'Hurts lower back', 'Hurts knees', 'Hurts shoulder', 'No equipment', 'Boring']

const xpAll = () => D.meta.exPrefs || {};

let aiCtl = null;
async function runAI(periodKey, outEl, btn){
  if(!sampleFn) return;
  const r = periodRange(periodKey), st = ST();
  const prompt = 'You are an experienced personal trainer. Write an overview in English for ' + (st.name || 'the user') + ' covering ' + r.label + ', based on the training log below.\n' +
    'Training philosophy: few working sets to failure, knee-friendly exercise choices, and a balance of strength, cardio and mobility.\n' +
    'Write 3 to 5 short paragraphs, each with a short heading on its own line starting with "## ". No bullet lists and no dashes. Be concrete and use the numbers. ' +
    'Cover wins (records and progression), consistency against the goal of ' + (st.goal || 3) + ' strength sessions a week and the morning check-ins, knee and foot, sleep and energy, and 2 to 3 concrete changes for the next period. Max 230 words.\n\nLOG\n' + buildSummary(r);
  if(btn) btn.disabled = true;
  outEl.innerHTML = '<p class="sub">Thinking…</p>';
  aiCtl = new AbortController();
  try{
    const res = await sampleFn(prompt, {signal: aiCtl.signal, cache: false, onText: ({text}) => { outEl.innerHTML = reportHtml(text); }});
    outEl.innerHTML = reportHtml(res.text);
    const id = 'ai-' + r.id;
    queue('set', 'feedback', id, {id, kind: periodKey.startsWith('m') ? 'monthly' : 'period', date: todayISO(), label: r.label, text: res.text, createdAt: Date.now(), source:'app'});
  }catch(e){
    outEl.innerHTML = e && e.text ? reportHtml(e.text) : '';
    if(e && e.code !== 'cancelled') toast('Could not summarise right now');
  }finally{ if(btn) btn.disabled = false; }
}

async function exportCSV(){
  const q = v => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['type','date','workout','exercise_or_activity','set','kg','reps','rir','partials','time_sec','distance_m','effort','knee_foot','notes']];
  for(const s of D.sessions.slice().sort((a,b) => a.startedAt - b.startedAt)){
    if(s.kind === 'styrke') setsOf(s.id).slice().sort((a,b) => a.ts - b.ts).forEach(x => rows.push(['strength', x.date, sessionTitle(s), x.exercise, x.n, x.weight, x.reps, x.rir == null ? '' : x.rir, x.partials || '', '', '', s.rpe || '', s.knee || '', '']));
    else if(isCardioS(s)) (s.exercises || []).filter(e => e.log && !e.skip).forEach(e => rows.push(['cardio', s.date, sessionTitle(s), e.name, '', '', '', '', '', e.log.sec || '', e.log.distM || '', s.rpe || '', '', e.note || '']));
    else rows.push(['cardio', s.date, '', s.activity, '', '', '', '', '', s.durationSec || '', s.distM || '', s.rpe || '', s.knee || '', s.note || '']);
  }
  for(const c of [...D.checkins.values()].sort((a,b) => a.date < b.date ? -1 : 1)) rows.push(['checkin', c.date, '', '', '', c.kg || '', '', '', '', '', '', '', c.knee || '', [c.sleep ? c.sleep + ' h sleep' : '', c.energy ? 'energy ' + c.energy : '', c.sore ? 'sore ' + c.sore : '', c.note || ''].filter(Boolean).join(', ')]);
  const name = 'plates-' + todayISO() + '.csv', data = '﻿' + rows.map(r => r.map(q).join(',')).join('\n');
  if(downloadsApi){ try{ await downloadsApi.save({filename: name, data}); }catch(e){ if(e && e.code !== 'declined') toast('Download not available here'); } return; }
  const url = URL.createObjectURL(new Blob([data], {type:'text/csv'})), a = document.createElement('a');
  a.href = url; a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/* ---------- sliders ----------
   Plain range inputs. The weight slider gets a fixed range when the card first fills (half to one and a half times the
   starting weight, at least up to 60 kg) so the thumb never jumps while you use it; typing a weight outside widens it. */
// The ruler: a fine tick per step (or per round number when steps get too tight) and a taller one at round numbers,
// placed on real values like 40, 50 and 60 kg. Worked out again only when the range or the width changes.
const RTH = 6;
function paintRange(rg){
  const min = +rg.min, max = +rg.max, f = (+rg.value - min) / ((max - min) || 1), w = rg.clientWidth;
  rg.style.setProperty('--p', f * 100 + '%');
  if(!w) return;
  rg.style.setProperty('--pw', (RTH / 2 + f * (w - RTH)).toFixed(1) + 'px');
  const key = min + '|' + max + '|' + w + '|' + rg.step;
  if(rg._tk === key) return; rg._tk = key;
  const ppu = (w - RTH) / ((max - min) || 1), st = +rg.step || 1, mult = (v, b) => Math.abs(v / b - Math.round(v / b)) < 1e-6;
  const mi = [st, st * 2, 1, 2, 2.5, 5, 10, 20, 25, 50, 100].filter(v => v >= st - 1e-9 && mult(v, st)).sort((a, b) => a - b).find(v => v * ppu >= 5) || 100;
  const ma = [5, 10, 20, 25, 50, 100, 200, 500].find(v => v >= mi * 2 && mult(v, mi) && v * ppu >= 20) || mi * 5;
  const off = v => (RTH / 2 + (Math.ceil(min / v - 1e-9) * v - min) * ppu) % (v * ppu);
  rg.style.setProperty('--mi', (mi * ppu).toFixed(3) + 'px'); rg.style.setProperty('--ma', (ma * ppu).toFixed(3) + 'px');
  rg.style.setProperty('--mo1', (off(mi) - .5).toFixed(2) + 'px'); rg.style.setProperty('--mo2', (off(ma) - .75).toFixed(2) + 'px');
}
window.addEventListener('resize', () => document.querySelectorAll('.rng').forEach(paintRange));
const setsLabel = (o, n) => { if(!o) return; o.textContent = n ? String(n) : 'Free'; o.classList.toggle('free', !n); };
function syncRange(rg){
  const inp = $('#in-' + rg.dataset.k + '-' + rg.dataset.rf); if(!inp) return;
  const v = Math.max(0, (rg.dataset.rf === 'm' ? parseDur(inp.value) : num(inp.value)) || 0);
  // the weight slider spans half to one and a half times the starting weight, so each millimetre is a small step
  if(rg.dataset.rf === 'w' && !rg.dataset.top){ rg.dataset.top = '1'; rg.max = Math.max(60, Math.ceil((v * 1.5) / 10) * 10); rg.min = v >= 30 ? Math.floor(v * .5 / 10) * 10 : 0; }
  if(v > +rg.max) rg.max = rg.dataset.rf === 'w' ? Math.ceil((v * 1.25) / 10) * 10 : Math.ceil(v);
  if(v < +rg.min) rg.min = Math.max(0, Math.floor(v * .8 / 10) * 10);
  rg.value = v; paintRange(rg);
}
// iPhone only moves a slider when you hit the thumb itself. Here the whole strip works: tap beside the marker to move
// it one step that way (half a kilo, a rep, a set), or drag sideways from anywhere and the value follows your finger
// from where it was, without jumping. A tap is a real tap on the hidden switch, so iPhone ticks for every step; it
// does not let a web page tick while a finger drags. Like scrubbing a
// video, the further you pull your finger down below the slider while you drag, the slower it moves: gradually, from
// full speed right on the slider down to a quarter of it far below.
// An up or down swipe that starts on the slider is left to the page, so scrolling never changes a value.
function rangeNudge(rg, x){
  const b = rg.getBoundingClientRect(), min = +rg.min, max = +rg.max, f = (+rg.value - min) / ((max - min) || 1), at = b.left + RTH / 2 + f * (b.width - RTH);
  if(Math.abs(x - at) < 12) return;
  setRange(rg, +rg.value + (x > at ? 1 : -1) * (+rg.step || 1));
}
function setRange(rg, raw){

const fineAt = below => Math.max(.25, 1 / (1 + Math.max(0, below - 30) / 150));

// Settings, Notes: every note and rating you gave, grouped by exercise, the most recent first

/* ---------- 1RM test ----------
   Pick a lift and a goal. The test is a workout of its own: a ladder of warm-ups, an opener, a second attempt
   and a PR attempt. Each step fills in its weight and reps, and the best single lands on Records like any other set. */
const RM_STEPS = [[.5, 5, 'Warm-up'], [.7, 3, 'Warm-up'], [.82, 1, 'Warm-up'], [.9, 1, 'Opener'], [.975, 1, 'Second'], [1.025, 1, 'PR attempt']];
const rmLadder = goal => { const st = ST().step || 2.5; return RM_STEPS.map(([f, r, l]) => ({w: Math.max(0, Math.round(goal * f / st) * st), r, l})); };
function rmEstimate(name){ const p = strengthPRs().find(x => x.name === name); return p && p.e1 ? Math.round(p.e1.sc / (ST().step || 2.5)) * (ST().step || 2.5) : 0; }
function renderRmCard(){
  const tests = D.sessions.filter(x => isTestS(x) && x.kind === 'styrke').slice().sort((a, b) => b.startedAt - a.startedAt).slice(0, 2);
  const rows = tests.map(x => { const name = (x.exercises && x.exercises[0] || {}).name; const best = setsOf(x.id).filter(y => y.reps === 1).sort((a, b) => b.weight - a.weight)[0];
    return name ? '<div class="li rmrow"><span>' + esc(name) + ' <small>' + esc(dShort(x.date)) + '</small></span><b>' + (best ? fmt(best.weight) + ' kg' : !x.endedAt ? 'Running' : 'No single') + '</b></div>' : ''; }).join('');
  setHTML($('#rm-card'), '<div class="hd"><h2>1RM test</h2></div>' + (rows ? '<div class="rmlist">' + rows + '</div>' : '<p class="sub" style="margin-top:4px">Find your max for one rep, step by step.</p>') +
    '<div class="two" style="margin-top:12px"><button class="btn-primary" data-a="rm-open">Test a lift</button><button class="btn-glass" data-a="best-lifts">Best lifts</button></div>');
}
function openRm(pre){
  const prs = strengthPRs().filter(p => !p.info.bw).sort((a, b) => b.e1.sc - a.e1.sc);
  const names = prs.map(p => p.name), extra = D.lib.filter(x => x.kind === 'b' && !x.bw && !names.includes(x.name)).map(x => x.name);
  const all = names.concat(extra), first = pre && all.includes(pre) ? pre : all[0] || 'Bench Press';
  S.ui.rm = {name: first, goal: rmEstimate(first) || 60};
  openSheet('rm', shTop('1RM test'), '<p class="lab">Lift</p>' + pickerHtml('rm-ex', all, first) +
    '<div class="steppers slide" style="margin-top:12px"><div class="stp"><label for="rm-goal">goal kg</label><output id="rm-goal-v"></output><input type="range" class="rng" id="rm-goal" min="20" max="300" step="' + (ST().step || 2.5) + '" value="60" aria-label="Goal"></div></div>' +

/* iOS pans the whole page up when the keyboard opens and sometimes leaves it there, which shows up as a dark strip at the bottom. Put it back. */

/* The keyboard covers the bottom of the page and the page itself does not shrink, so a field low on the page (like the

   field (the whole composer for a message) up so it sits just above the keyboard. */
let fullH = 0;
const measureFull = () => { if(!typingField(document.activeElement)) fullH = Math.max(innerHeight, document.documentElement.clientHeight); };
addEventListener('resize', measureFull); measureFull();
function liftField(){
  const el = document.activeElement, v = window.visualViewport;
  if(!typingField(el) || !v) return;
  document.documentElement.style.setProperty('--kb', Math.max(0, Math.round(Math.max(fullH, innerHeight) - v.height)) + 'px');
  const dock = el.closest('.dock');
  if(dock){ dock.style.bottom = 'auto'; dock.style.top = Math.round(v.offsetTop + v.height - dock.offsetHeight - 8) + 'px'; return; }
  const sc = el.closest('.view, .sheet-body, .settings'); if(!sc) return;
  const box = el.closest('.cmp') || el, r = box.getBoundingClientRect();
  const top = v.offsetTop + 70, bottom = v.offsetTop + v.height - 22;
  const dy = r.bottom > bottom ? Math.min(r.bottom - bottom, r.top - top) : r.top < top ? r.top - top : 0;
  if(Math.abs(dy) > 2) sc.scrollBy({top: dy, behavior: reduceMotion() ? 'auto' : 'smooth'});
}
let liftT = null;
const liftSoon = ms => { clearTimeout(liftT); liftT = setTimeout(liftField, ms); };
document.addEventListener('focusin', e => {
  const t = e.target;
  if(typingField(t)){ clearTimeout(kbT); document.body.classList.add('kb'); liftSoon(320); }
