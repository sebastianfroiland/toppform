      break;
    }
    case 'routine-open': openRoutinePreview(b.dataset.id); break;
    case 'routine-new': openRoutine(null); break;
    case 'routine-edit': openRoutine(b.dataset.id); break;
    case 'routine-back': renderRoutineSheet(); break;
    case 'rd-add': rdSync(); openLib('routine', null); break;
    case 'rd-up': case 'rd-down': case 'rd-del': {
      rdSync(); const rd = S.ui.rd, i = +b.dataset.i; if(!rd) break;
      if(a === 'rd-del') rd.items.splice(i, 1);
      else { const j = a === 'rd-up' ? i - 1 : i + 1; if(j >= 0 && j < rd.items.length){ const t = rd.items[i]; rd.items[i] = rd.items[j]; rd.items[j] = t; } }
      renderRoutineSheet(); break;
    }
    case 'rd-save': saveRoutine(); break;
    case 'rd-delete': {
      const rd = S.ui.rd; if(!rd || !rd.id) break;
      if(S.ui.armedAct === 'rd-del'){ disarmAct(); queue('delete', 'routines', rd.id); S.ui.rd = null; closeSheet(); toast('Workout deleted'); }
      else armButton('rd-delete', 'rd-del', 'Delete workout', 'Tap again to delete');
      break;
    }
    case 'checkin': closeSettings(); openCheckin(); break;
    case 'ci-save': saveCheckin(b.dataset.d); break;
    case 'c-save': saveCardio(); break;
    case 'd-reopen': { const id = b.dataset.id; updateSession(id, {endedAt:null}); S.activeId = id; ls.set('tl.active', id); closeSheet(); selectTab(1); break; }
    case 'd-del': {
      const id = b.dataset.id;
      if(S.ui.armedAct === 'del:' + id){ disarmAct(); deleteSession(id); closeSheet(); toast('Deleted'); }
      else armButton('d-del', 'del:' + id, b.textContent, 'Tap again to delete');
      break;
    }
    case 'settings': openSettings(); break;
    case 'settings-close': closeSettings(); break;
    case 'set-switch': { const k = b.dataset.k, v = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', String(v)); saveSettings({[k]: v}); if(k === 'sound' && v){ ensureAudio(); beep(); } break; }
    case 'set-seg': { const g = b.parentElement, all = [...g.children]; all.forEach(x => x.classList.toggle('on', x === b)); g.style.setProperty('--i', all.indexOf(b)); saveSettings({[b.dataset.k]: b.dataset.v}); if(b.dataset.k === 'style') renderSettings(); break; }
    case 'set-accent': [...b.parentElement.children].forEach(x => x.classList.toggle('on', x === b)); saveSettings({accent: b.dataset.v}); renderSettings(); break;
    case 'gh-connect': ghConnect(b); break;
    case 'gh-skip': S.ui.skipConnect = true; renderToday(); break;
    case 'gh-show': closeSettings(); S.ui.skipConnect = false; S.needsConnect = true; $('#connect').dataset.built = ''; selectTab(0); renderToday(); break;
    case 'gh-disconnect': if(S.ui.armedAct === 'ghd'){ disarmAct(); ghDisconnect(); } else armButton('ghd-btn', 'ghd', 'Disconnect', 'Tap again'); break;
    case 'ask-overview': { const key = $('#req-period').value, r = periodRange(key), id = newId(); queue('set', 'requests', id, {id, type:'overview', period:key, label:r.label, date:todayISO(), createdAt:Date.now()}); toast('Claude will write it tonight'); renderFeedbackPanel(); break; }
    case 'feedback-open': closeSheet(); openSettings('claude'); break;
    case 'ai-run': openSheet('ai', shTop('Overview', periodRange($('#period').value).label), '<div class="report" id="ai-sheet-out"></div>', true); runAI($('#period').value, $('#ai-sheet-out'), null); break;
    case 'ai-run-set': runAI($('#ai-period').value, $('#ai-out'), b); break;
    case 'copy-summary': copySummary(); break;
    case 'export': exportCSV(); break;
    case 'sound': saveSettings({sound: !ST().sound}); setTimeout(() => { ensureAudio(); if(ST().sound) beep(); tickRest(); }, 0); break;
    case 'rest-close': stopRest(); break;
  }
});
$('#setNav').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if(!b) return; S.ui.setPanel = b.dataset.p; renderSettings(); });
function saveSettings(patch){
  const settings = Object.assign({}, ST(), patch);
  queue('set', 'meta', 'logg', Object.assign({}, D.meta, {settings, updatedAt: Date.now()}));
}
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.set){ const k = t.dataset.set, numeric = ['weeks','goal','step','restB','restI','warmMin'].includes(k); saveSettings({[k]: numeric ? num(t.value) : t.value.trim()}); if(k === 'warm') renderSettings(); return; }
  if(t.id === 'period'){ renderProgress(); return; }
  if(t.id === 'pr-filter'){ S.ui.prFilter = t.value; renderRecords(); return; }
  if(t.id === 'pr-sort'){ S.ui.prSort = t.value; renderRecords(); return; }
  if(t.id === 'fb-sel'){ S.ui.fbKey = t.value; renderFeedbackPanel(); return; }
  if(t.id === 's-rpe'){ const s = activeSession(); if(s) updateSession(s.id, {rpe: num(t.value)}); return; }
  if(t.id === 'c-act'){ const was = S.ui.c && S.ui.c.activity, now = t.value; if(S.ui.c) S.ui.c.activity = now; $('#c-unit').textContent = now === 'Row' ? 'm' : 'km';
    const di = $('#c-dist'), dv = num(di.value); if(dv != null && (was === 'Row') !== (now === 'Row')) di.value = now === 'Row' ? String(Math.round(dv * 1000)) : fmt(dv / 1000); return; }
  if(t.dataset && t.dataset.sets != null && t.classList.contains('rng')){ S.ui.sliding = null; const s = activeSession(), k = t.dataset.sets; if(s){ S.ui.expanded.delete(k); updateSession(s.id, {exercises: s.exercises.map(e => e.k === k ? Object.assign({}, e, {planned: +t.value}) : e)}); } return; }
  if(t.dataset && t.dataset.exSets != null){ const s = activeSession(), k = t.dataset.exSets; if(s){ S.ui.expanded.delete(k); updateSession(s.id, {exercises: s.exercises.map(e => e.k === k ? Object.assign({}, e, {planned: +t.value}) : e)}); } return; }
  if(t.dataset && t.dataset.warmAct != null){ const s = activeSession(), k = t.dataset.warmAct; ls.set('tl.lastWarm', t.value); if(s) updateSession(s.id, {exercises: s.exercises.map(e => e.k === k ? Object.assign({}, e, {name: t.value}) : e)}); return; }
  if(t.dataset && t.dataset.rdSets != null && S.ui.rd){ S.ui.rd.items[+t.dataset.rdSets].sets = +t.value; return; }
  if(t.id === 'rd-rot' && S.ui.rd){ S.ui.rd.rotation = t.value === '1'; return; }
  if(t.id === 'rd-folder' && S.ui.rd){ S.ui.rd.folder = t.value; return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.type === 'color' && t.dataset.set){ const a = t.dataset.set === 'c1' ? [t.value, ST().c2] : [ST().c1, t.value]; document.documentElement.style.setProperty('--g1', a[0]); document.documentElement.style.setProperty('--g2', a[1]); return; }
  if(t.matches && t.matches('.stp input')) t.dataset.touched = '1';
  if(t.id === 's-note'){ clearTimeout(noteT); noteT = setTimeout(saveNote, 800); }
  if(t.id === 'rd-name' && S.ui.rd) S.ui.rd.name = t.value;
});
/* iOS pans the whole page up when the keyboard opens and sometimes leaves it there, which shows up as a dark strip at the bottom. Put it back. */
let kbT = null;
const typingField = el => !!(el && el.matches && el.matches('input:not([type=date]):not([type=range]):not([readonly]), textarea'));
function resetScroll(){ if(window.scrollY || document.documentElement.scrollTop || document.body.scrollTop){ window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } }
/* The keyboard covers the bottom of the page and the page itself does not shrink, so a field low on the page (like the
   reply to Claude) ends up behind it. Measure the keyboard, give the page that much room underneath, and scroll the
   field (the whole composer for a message) up so it sits just above the keyboard. */
let fullH = 0;
const measureFull = () => { if(!typingField(document.activeElement)) fullH = Math.max(innerHeight, document.documentElement.clientHeight); };
addEventListener('resize', measureFull); measureFull();
function liftField(){
  const el = document.activeElement, v = window.visualViewport;
  if(!typingField(el) || !v) return;
  document.documentElement.style.setProperty('--kb', Math.max(0, Math.round(Math.max(fullH, innerHeight) - v.height)) + 'px');
  const dock = el.closest('.dock');
  if(dock){ dock.style.bottom = 'auto'; dock.style.top = Math.round(v.offsetTop + v.height - dock.offsetHeight - 8) + 'px'; return; }
  const sc = el.closest('.view, .sheet-body, .settings'); if(!sc) return;
  const box = el.closest('.cmp') || el, r = box.getBoundingClientRect();
  const top = v.offsetTop + 70, bottom = v.offsetTop + v.height - 22;
  const dy = r.bottom > bottom ? Math.min(r.bottom - bottom, r.top - top) : r.top < top ? r.top - top : 0;
  if(Math.abs(dy) > 2) sc.scrollBy({top: dy, behavior: reduceMotion() ? 'auto' : 'smooth'});
}
let liftT = null;
const liftSoon = ms => { clearTimeout(liftT); liftT = setTimeout(liftField, ms); };
document.addEventListener('focusin', e => {
  const t = e.target;
  if(typingField(t)){ clearTimeout(kbT); document.body.classList.add('kb'); liftSoon(320); }
  if(t.matches && t.matches('.stp input:not(.rng)')) setTimeout(() => { try{ t.select(); }catch(x){} }, 0);
});
document.addEventListener('focusout', e => {
  const t = e.target;
  clearTimeout(kbT);
  kbT = setTimeout(() => { if(!typingField(document.activeElement)){ document.body.classList.remove('kb'); $('#dock').style.top = $('#dock').style.bottom = ''; resetScroll(); } }, 120);
});
document.addEventListener('input', e => { if(e.target.matches && e.target.matches('textarea')) liftSoon(60); });
if(window.visualViewport) visualViewport.addEventListener('resize', () => {
  if(visualViewport.height > innerHeight * .85){ if(!typingField(document.activeElement)) document.body.classList.remove('kb'); resetScroll(); fixGap(); }
  else if(document.body.classList.contains('kb')) liftSoon(60);
});
if(window.visualViewport) visualViewport.addEventListener('scroll', () => { if(document.activeElement && document.activeElement.closest && document.activeElement.closest('.dock')) liftSoon(0); });
addEventListener('scroll', () => { if(!typingField(document.activeElement)) resetScroll(); }, {passive:true});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#setModal').classList.contains('open')) closeSettings();
  if(e.key === 'Enter' && e.target.matches && e.target.matches('.stp input, #c-dur, #c-dist, #ci-kg, .field.small, #fd-name, #rd-name, .exs')){ e.preventDefault(); e.target.blur(); }
});
$('#s-note').addEventListener('blur', saveNote);
$('#setModal').inert = true;

init();
})();
</script>
