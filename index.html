function base(){ return S.db.doc('data/users/' + S.uid + '/logg'); }
const refFor = (col, id) => col === 'meta' ? base() : base().collection(col).doc(id);
async function dbFlush(){
  S.inflight = 1;
  try{
    while(S.pending.length){
      const p = S.pending[0];
      try{ const ref = refFor(p.col, p.id); if(p.op === 'set') await ref.set(p.data); else await ref.delete(); S.pending.shift(); savePending(); retryMs = 0; }
      catch(e){
        const code = e && e.code;
        if(code === 'invalid_argument' || code === 'transform_error'){ S.readonly = true; break; }
        if(code === 'quota_exceeded'){ toast('Storage is full'); break; }
        if(['revoked','not_granted','capability_disabled','capability_removed'].includes(code)){ S.mode = 'local'; break; }
        retryLater(); break;
      }
    }
  } finally { S.inflight = 0; renderStatus(); }
}
function mapOf(q){ const m = new Map(); q.docs.forEach(d => { const v = d.data(); if(v) m.set(d.id, v); }); return m; }
function dbSubscribe(){
  const onErr = e => { console.warn('db', e); if(e && e.code === 'revoked') S.mode = 'local'; renderStatus(); };
  const order = {sessions:['startedAt',500], sets:['ts',1000], body:['date',300], checkins:['date',400], plans:['date',30]};
  for(const col of COLS){
    let q = base().collection(col);
    if(order[col]) q = q.orderBy(order[col][0], 'desc').limit(order[col][1]);
    q.onSnapshot(snap => { S.snap[col] = mapOf(snap); loadedCol(col); refresh(); }, onErr);
  }
  base().onSnapshot(d => { const m = new Map(); if(d.exists) m.set('logg', d.data()); S.snap.meta = m; loadedCol('meta'); refresh(); }, onErr);
}

const GH = { cfg: loadJSON('tl.gh', null), head: null, branch: 'main', files: {}, index: {}, authError: false };
const GQL = 'https://api.github.com/graphql';
async function gql(query, variables, token){
  let res;
  try{ res = await fetch(GQL, {method:'POST', headers:{'Authorization':'bearer ' + (token || GH.cfg.token), 'Content-Type':'application/json'}, body: JSON.stringify({query, variables})}); }
  catch(e){ throw {net:true}; }
  if(res.status === 401 || res.status === 403) throw {auth:true, status:res.status};
  if(!res.ok) throw {net:true, status:res.status};
  const j = await res.json();
  if(j.errors && j.errors.length) throw {gql:true, message: j.errors.map(e => e.message).join('; ')};
  return j.data;
}
const Q_LOAD = 'query($o:String!,$n:String!){repository(owner:$o,name:$n){defaultBranchRef{name target{oid}} object(expression:"HEAD:data"){... on Tree{entries{name type object{... on Blob{text} ... on Tree{entries{name type object{... on Blob{text}}}}}}}}}}';
const Q_HEAD = 'query($o:String!,$n:String!){repository(owner:$o,name:$n){name defaultBranchRef{target{oid}}}}';
const M_COMMIT = 'mutation($i:CreateCommitOnBranchInput!){createCommitOnBranch(input:$i){commit{oid}}}';
const FLAT = {meta:'data/meta.json', routines:'data/routines.json', folders:'data/folders.json', plans:'data/plans.json', requests:'data/requests.json'};
function filesToSnap(){
  const snap = emptySnap();
  GH.index = {};
  for(const [path, obj] of Object.entries(GH.files)){
    if(!obj || typeof obj !== 'object') continue;
    if(path === FLAT.meta){ snap.meta.set('logg', obj); continue; }
    const flat = Object.keys(FLAT).find(k => FLAT[k] === path);
    const m = /^data\/([a-z]+)\/[^/]+\.json$/.exec(path);
    const col = flat || (m && m[1]);
    if(!col || !snap[col]) continue;
    for(const [id, doc] of Object.entries(obj)){ if(doc && typeof doc === 'object'){ snap[col].set(id, doc); GH.index[col + '/' + id] = path; } }
  }
  S.snap = snap;
}
function ghCache(){ try{ localStorage.setItem('tl.gh.cache', JSON.stringify({head: GH.head, branch: GH.branch, files: GH.files})); }catch(e){} }
function ghPath(op){
  if(FLAT[op.col]) return FLAT[op.col];
  let month = op.op === 'set' && op.data && op.data.date ? String(op.data.date).slice(0, 7) : null;
  if(!month){ const old = GH.index[op.col + '/' + op.id]; if(old) return old; month = todayISO().slice(0, 7); }
  return 'data/' + op.col + '/' + month + '.json';
}
async function ghLoad(){
  const d = await gql(Q_LOAD, {o: GH.cfg.owner, n: GH.cfg.repo});
  const repo = d.repository; if(!repo) throw {auth:true};
  GH.branch = repo.defaultBranchRef ? repo.defaultBranchRef.name : 'main';
  GH.head = repo.defaultBranchRef ? repo.defaultBranchRef.target.oid : null;
  const files = {};
  const walk = (entries, prefix) => (entries || []).forEach(e => {
    const p = prefix + '/' + e.name;
    if(e.type === 'blob' && /\.json$/.test(e.name) && e.object && e.object.text != null){ try{ files[p] = JSON.parse(e.object.text); }catch(x){ console.warn('Could not read', p); } }
    else if(e.type === 'tree' && e.object && e.object.entries) walk(e.object.entries, p);
  });
  if(repo.object) walk(repo.object.entries, 'data');

}
const b64 = s => { const bytes = new TextEncoder().encode(s); let bin = ''; for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
function commitMsg(ops){
  const p = ops[0]; let m = 'Update';
  if(p.col === 'sets' && p.op === 'set') m = 'Set: ' + p.data.exercise + ' ' + (p.data.weight || 0) + ' x ' + p.data.reps;
  else if(p.col === 'sessions' && p.op === 'set') m = p.data.kind === 'kondis' ? 'Cardio: ' + p.data.activity : 'Workout: ' + (p.data.title || 'strength');
  else if(p.col === 'checkins') m = 'Check-in ' + p.id;
  else if(p.col === 'routines' || p.col === 'folders') m = 'Workouts';
  else if(p.col === 'meta') m = 'Settings';
  else if(p.col === 'requests') m = 'Request for Claude';
  else if(p.col === 'messages' || p.col === 'photos') m = 'Message to Claude';
  else if(p.op === 'delete') m = 'Deleted from ' + p.col;

async function ghFlush(){
  if(!GH.head){ GH.emptyRepo = true; renderStatus(); return; }
  const ops = S.pending.slice(0, 40); S.inflight = ops.length;
  let again = false;
  try{
    const changed = {};
    const get = p => changed[p] || (changed[p] = JSON.parse(JSON.stringify(GH.files[p] || {})));
    const photoAdds = [];
    for(const op of ops){
      if(op.col === 'photos'){ photoAdds.push({path: 'data/photos/' + op.id + '.jpg', contents: op.data.b64}); continue; }
      const path = ghPath(op);
      if(op.col === 'meta'){ changed[path] = op.data; continue; }
      const old = GH.index[op.col + '/' + op.id];
      if(old && old !== path) delete get(old)[op.id];
      if(op.op === 'set') get(path)[op.id] = op.data; else delete get(path)[op.id];
    }
    const additions = photoAdds.concat(Object.keys(changed).map(p => ({path: p, contents: b64(JSON.stringify(changed[p], null, 1) + '\n')})));
    const d = await gql(M_COMMIT, {i: {branch: {repositoryNameWithOwner: GH.cfg.owner + '/' + GH.cfg.repo, branchName: GH.branch}, message: {headline: commitMsg(ops)}, expectedHeadOid: GH.head, fileChanges: {additions}}});
    GH.head = d.createCommitOnBranch.commit.oid;
    Object.assign(GH.files, changed);
    S.pending.splice(0, ops.length); savePending(); filesToSnap(); ghCache(); retryMs = 0; S.mode = 'live';
    again = S.pending.length > 0;
  }catch(e){
    if(e && e.auth) GH.authError = true;
    else if(e && e.gql && /expect|head|oid|fast.?forward/i.test(e.message || '')){ try{ await ghLoad(); again = true; }catch(x){ retryLater(); } }
    else { if(navigator.onLine === false || (e && e.net)) S.mode = 'offline'; retryLater(); }
  } finally { S.inflight = 0; refresh(); if(again) scheduleFlush(200); }
}
async function ghCheck(){
  if(S.backend !== 'gh' || S.inflight || document.hidden) return;
  try{
    const d = await gql(Q_HEAD, {o: GH.cfg.owner, n: GH.cfg.repo});
    const oid = d.repository && d.repository.defaultBranchRef ? d.repository.defaultBranchRef.target.oid : null;
    if(oid && oid !== GH.head && !S.inflight){ await ghLoad(); refresh(); }
    S.mode = 'live'; GH.authError = false; renderStatus();
    if(S.pending.length) scheduleFlush();
  }catch(e){ if(e && e.auth) GH.authError = true; else S.mode = 'offline'; renderStatus(); }
}
setInterval(ghCheck, 90000);

async function ghStart(){

  try{ await ghLoad(); }

}

/* Workout (while no workout runs), Log and Body fit the screen. Try the fitted layout and keep it only when nothing

function syncFit(){
  const act = activeSession(), bar = $('#tabbar').getBoundingClientRect().top;
  for(const id of ['v-workout', 'v-log', 'v-body', 'v-records']){
    const vin = $('#' + id + ' .vin'), want = id !== 'v-workout' || !act || (ST().view === 'cards' && act.exercises.length > 0);
    vin.classList.toggle('fit', want);
    if(!want) continue;
    // the page must not scroll and nothing may end up behind the tab bar; otherwise it scrolls as usual
    const v = vin.parentElement, top = v.getBoundingClientRect().top;
    let bottom = 0; for(const c of vin.children){ if(c.offsetParent !== null) bottom = Math.max(bottom, c.getBoundingClientRect().bottom - top); }
    if(v.scrollHeight > v.clientHeight + 1 || bottom > bar - top - 4) vin.classList.remove('fit');

  else if(gh && GH.authError){ s = 'off'; t = 'Token rejected'; note = 'GitHub no longer accepts your token. Everything you log is kept on this phone. Create a new token and reconnect under Settings, Data.'; }
  else if(gh && GH.emptyRepo){ s = 'off'; t = 'Empty repo'; note = 'Your data repo has no files yet. Add a README on github.com and the app can save.'; }
  else if(S.mode === 'offline'){ s = 'busy'; t = S.pending.length ? 'Saves when online' : 'Offline'; }
  else if(S.mode === 'local'){ s = 'off'; t = S.pending.length ? 'Saved on phone' : 'Phone only'; if(!S.needsConnect) note = 'Not connected right now. What you log is kept on this phone and uploads when the app reconnects.'; }

/* Keep the screen on while a workout runs, so the phone does not lock between sets */

function strengthPRs(){
  const by = new Map();
  for(const x of D.sets){ if(!by.has(x.exercise)) by.set(x.exercise, []); by.get(x.exercise).push(x); }
  const out = [];
  for(const [name, xs] of by){
    const info = infoOf(name); let e1 = null, maxReps = null; const rms = {};
    for(const x of xs){
      const sc = score(x.weight||0, x.reps||0, info); if(!e1 || sc > e1.sc) e1 = {sc, x};
      for(const n of RMS){ if((x.reps||0) < n) continue; const cur = rms[n], w = x.weight||0;
        if(!cur || (info.bw === 'assist' ? w < (cur.weight||0) : w > (cur.weight||0)) || (w === (cur.weight||0) && x.reps > cur.reps)) rms[n] = x; }
      if(info.bw && !(x.weight > 0) && (!maxReps || x.reps > maxReps.reps)) maxReps = x;
    }
    out.push({name, info, e1, rms, maxReps, last: D.lastUsed.get(name) || 0});
  }
  return out;
}
function prEvents(days){
  const asc = D.sets.slice().sort((a,b) => a.ts - b.ts), best = new Map(), ev = [], from = addDays(todayISO(), -days);
  for(const x of asc){ const info = infoOf(x.exercise), sc = score(x.weight||0, x.reps||0, info), b = best.get(x.exercise);
    if((b == null || sc > b + 1e-9) && x.date >= from) ev.push(x);
    if(b == null || sc > b) best.set(x.exercise, sc); }
  const seen = new Set();
  return ev.reverse().filter(x => { const k = x.exercise + '|' + x.date; if(seen.has(k)) return false; seen.add(k); return true; });
}
function cardioPRs(){
  const by = {};
  for(const s of D.sessions) if(s.kind === 'kondis' && s.activity){ (by[s.activity] = by[s.activity] || []).push(s); }
  const out = [];
  for(const act of Object.keys(by)){
    const xs = by[act], tiles = [], paced = xs.filter(s => s.distM && s.durationSec);
    if(act === 'Run'){
      const best = min => paced.filter(s => s.distM >= min).map(s => ({s, pace: s.durationSec / (s.distM / 1000)})).sort((a,b) => a.pace - b.pace)[0];
      const p1 = best(1000), p5 = best(5000), p10 = best(10000);
      if(p1) tiles.push(['Best pace', mmss(p1.pace) + ' /km', p1.s.date]);
      if(p5) tiles.push(['5K', mmss(p5.pace * 5), p5.s.date]);
      if(p10) tiles.push(['10K', mmss(p10.pace * 10), p10.s.date]);
    }
    if(act === 'Row'){
      const r2 = paced.filter(s => s.distM >= 1950).map(s => ({s, t: Math.abs(s.distM - 2000) <= 50 ? s.durationSec : s.durationSec / s.distM * 2000})).sort((a,b) => a.t - b.t)[0];
      const sp = paced.filter(s => s.distM >= 500).map(s => ({s, sp: s.durationSec / (s.distM / 500)})).sort((a,b) => a.sp - b.sp)[0];
      if(r2) tiles.push(['2000 m', mmss(r2.t), r2.s.date]);
      if(sp) tiles.push(['Best split', mmss(sp.sp) + ' /500m', sp.s.date]);
    }
    const longD = xs.filter(s => s.distM).sort((a,b) => b.distM - a.distM)[0], longT = xs.filter(s => s.durationSec).sort((a,b) => b.durationSec - a.durationSec)[0];
    if(longD) tiles.push(['Longest', act === 'Row' ? longD.distM + ' m' : fmt(Math.round(longD.distM / 100) / 10) + ' km', longD.date]);
    if(longT) tiles.push(['Longest time', fmtDur(longT.durationSec), longT.date]);
    if(tiles.length) out.push({act, n: xs.length, tiles});
  }
  return out.sort((a,b) => b.n - a.n);
}

/* ---------- charts ----------
   Smooth curves (monotone, so they never bulge past a real value), a clean line without a fill, and a dot on the
   latest point. Drag a finger along a chart to read every point. */
function smoothPath(P){
  const n = P.length, f = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  if(n < 2) return '';
  if(n === 2) return 'M' + f(P[0]) + 'L' + f(P[1]);
  const dx = [], m = [], t = [];
  for(let i = 0; i < n - 1; i++){ dx[i] = P[i + 1][0] - P[i][0]; m[i] = (P[i + 1][1] - P[i][1]) / (dx[i] || 1e-6); }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for(let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for(let i = 0; i < n - 1; i++){
    if(m[i] === 0){ t[i] = t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if(s > 9){ const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = 'M' + f(P[0]);
  for(let i = 0; i < n - 1; i++){ const h = dx[i] / 3; d += 'C' + f([P[i][0] + h, P[i][1] + t[i] * h]) + ' ' + f([P[i + 1][0] - h, P[i + 1][1] - t[i + 1] * h]) + ' ' + f(P[i + 1]); }
  return d;
}

function scrubCurve(el, x){
  let pts; try{ pts = JSON.parse(el.dataset.pts); }catch(e){ return; }
  const b = el.getBoundingClientRect(), pct = (x - b.left) / b.width * 100;
  let best = pts[0]; for(const p of pts) if(Math.abs(p[0] - pct) < Math.abs(best[0] - pct)) best = p;
  const dot = el.querySelector('.cdot'), tip = el.querySelector('.ctip');
  dot.style.left = tip.style.left = best[0] + '%'; dot.style.top = best[1] + 'px'; tip.style.top = (best[1] - 8) + 'px';

  el.classList.add('scrub');
}
function endScrub(el){

// Which side shows a muscle best, so tapping it in the list turns the figure the right way
const FACE = {chest: 'front', abs: 'front', obl: 'front', quads: 'front', add: 'front', biceps: 'front', traps: 'back', rear: 'back', lats: 'back', lower: 'back', tri: 'back', glutes: 'back', hams: 'back'};
const mirrorPath = d => d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (_, x, y) => (200 - +x) + ',' + y);
function figureSvg(side, heat, hot){
  let shapes = '', clip = '';
  const one = (s, mir) => {
    const [r, kind] = s, attr = r === 'nt' || r === 'sil' ? 'class="' + r + '"' : 'class="mu' + (hot.includes(r) ? ' hot' : '') + '" data-a="muscle" data-m="' + r + '" style="fill:' + heat(r) + '"';
    let g;
    if(kind === 'e'){ const cx = mir ? 200 - s[2] : s[2]; g = '<ellipse cx="' + cx + '" cy="' + s[3] + '" rx="' + s[4] + '" ry="' + s[5] + '"'; }
    else if(kind === 'r'){ const x = mir ? 200 - s[2] - s[4] : s[2]; g = '<rect x="' + x + '" y="' + s[3] + '" width="' + s[4] + '" height="' + s[5] + '" rx="4.5"'; }
    else g = '<path d="' + (mir ? mirrorPath(s[2]) : s[2]) + '"';
    shapes += g + ' ' + attr + '/>'; clip += g + '/>';
  };
  for(const s of FIG[side]){ one(s, false); if(s[s.length - 1] !== 1) one(s, true); }
  // a soft light from the upper left over the whole body gives it some depth
  return '<svg viewBox="26 4 148 398" role="img" aria-label="Muscles, ' + side + '"><defs><clipPath id="fc-' + side + '">' + clip + '</clipPath>' +
    '<radialGradient id="fs-' + side + '" cx="' + (side === 'front' ? '.32' : '.68') + '" cy=".22" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient></defs>' +
    shapes + '<rect x="0" y="0" width="200" height="404" fill="url(#fs-' + side + ')" clip-path="url(#fc-' + side + ')" pointer-events="none"/></svg>';
}
function guidance(sc, r, p){
  const out = [], vals = Object.values(sc), tot = vals.reduce((a, b) => a + b, 0), mx = Math.max.apply(null, vals), nm = k => REGIONS[k][0];
  const last = r.key === 'last', weeks = Math.max(1, (dayDiff(r.to, r.from) + 1) / 7), lower = a => andList(a).toLowerCase();
  if(!tot) return ['Log a workout and the body fills in.'];
  const top = Object.keys(sc).filter(k => sc[k] >= mx * .7).sort((a, b) => sc[b] - sc[a]).slice(0, 3);
  out.push('Most work: ' + lower(top.map(nm)) + '.');
  const low = ['chest', 'lats', 'traps', 'delts', 'quads', 'hams', 'glutes'].filter(k => sc[k] < mx * .15).map(nm);
  if(low.length) out.push(last ? 'Not trained this time: ' + lower(low) + '.' : 'Little or no work: ' + lower(low) + '. Give them a couple of sets next time.');
  const push = sc.chest + sc.delts + sc.tri * .5, pull = sc.lats + sc.traps + sc.rear * .5 + sc.biceps * .5;
  if(push + pull >= 4){
    if(push > pull * 1.5) out.push('You push more than you pull. Add a row or a pulldown to keep your shoulders healthy.');
    else if(pull > push * 1.5) out.push('You pull more than you push. Add a press to even it out.');
  }
  if(!last){
    const goal = ST().goal || 3, perWeek = Math.round(p.str.length / weeks * 10) / 10;
    if(weeks >= 1.5 && p.str.length) out.push('You trained ' + fmt(perWeek) + ' times a week. Your goal is ' + goal + '.' + (perWeek >= goal ? ' Nice work.' : ''));
    if(p.sleep && p.sleep < 7) out.push('You slept ' + fmt(Math.round(p.sleep * 10) / 10) + ' hours a night. Aim for 7 or more to recover.');
    if(p.painDays) out.push(plural(p.painDays, 'day') + ' with pain. Pick exercises that feel good and tell Claude what hurts.');
    if(lvlNew()){ const k = Object.keys(sc).sort((a, b) => sc[b] - sc[a])[0]; out.push(nm(k) + ' got about ' + fmt(Math.round(sc[k] / weeks * 10) / 10) + ' sets a week. Around 10 hard sets a week per muscle builds muscle well.'); }
  }
  return out.slice(0, 5);
}

/* Records: only the key lifts (your goals first, then the compound lifts you do most). Each one opens into a chart
   of the lift over time, its volume, or how much stronger you are across all lifts. Everything else is under All lifts. */
function liftSeries(name){
  const info = infoOf(name), by = new Map();
  const reps = info.bw && !D.sets.some(x => x.exercise === name && x.weight > 0);
  for(const x of D.sets){
    if(x.exercise !== name) continue;
    const y = reps ? x.reps || 0 : score(x.weight || 0, x.reps || 0, info), v = by.get(x.sessionId) || {x: x.date, y: 0, vol: 0, ts: x.ts};
    v.y = Math.max(v.y, y); v.vol += reps ? x.reps || 0 : (x.weight || 0) * (x.reps || 0); v.ts = Math.min(v.ts, x.ts); by.set(x.sessionId, v);
  }
  const list = [...by.values()].sort((a, b) => a.ts - b.ts);
  return {reps, e1: list.map(v => ({x: v.x, y: reps ? v.y : Math.round(v.y * 2) / 2})), vol: list.map(v => ({x: v.x, y: v.vol}))};
}
function strengthIndex(){
  const asc = D.sets.slice().sort((a, b) => a.ts - b.ts), first = new Map(), best = new Map(), out = [];
  for(const x of asc){
    const info = infoOf(x.exercise); if(info.bw && !(x.weight > 0)) continue;
    const sc = score(x.weight || 0, x.reps || 0, info); if(!(sc > 0)) continue;
    if(!first.has(x.exercise)) first.set(x.exercise, sc);
    if(!best.has(x.exercise) || sc > best.get(x.exercise)) best.set(x.exercise, sc);
    let sum = 0; for(const [k, v] of best) sum += v / first.get(k);
    const y = Math.round((sum / best.size - 1) * 1000) / 10;
    if(out.length && out[out.length - 1].x === x.date) out[out.length - 1].y = y; else out.push({x: x.date, y});
  }
  return out;
}
function keyLifts(){
  const count = new Map();
  for(const x of D.sets){ if(!count.has(x.exercise)) count.set(x.exercise, new Set()); count.get(x.exercise).add(x.sessionId); }
  const prs = strengthPRs(), gl = goals().map(g => g.lift).filter(Boolean);
  const rank = p => (gl.includes(p.name) ? 1e6 : 0) + (p.info.kind === 'b' ? 1e4 : 0) + count.get(p.name).size * 100 + Math.min(99, p.e1.sc / 4);
  return prs.slice().sort((a, b) => rank(b) - rank(a)).slice(0, Math.max(4, gl.length));
}

}

  const i = L.k ? ex.findIndex(e => e.k === L.k) : -1;
  let newK = null;
  if(L.mode === 'swap' && i >= 0){ ex[i].from = ex[i].from || ex[i].name; ex[i].name = name; ex[i].hint = ''; }

  else { newK = newId(); ex.push({k:newK, name, planned: s.template === 'F' ? 0 : 1, hint:''}); }
  const mode = L.mode;
  updateSession(s.id, {exercises:ex});

  if(mode === 'swap') toast('Swapped to ' + name);
  if(newK) setTimeout(() => { const el = document.querySelector('#cards .ex[data-k="' + newK + '"]'); if(!el) return;

/* ---------- sliders ----------
   Plain range inputs. The weight slider gets a fixed range when the card first fills (half to one and a half times the
   starting weight, at least up to 60 kg) so the thumb never jumps while you use it; typing a weight outside widens it. */
const paintRange = rg => rg.style.setProperty('--p', ((+rg.value - +rg.min) / ((+rg.max - +rg.min) || 1) * 100) + '%');
const setsLabel = (o, n) => { if(!o) return; o.textContent = n ? String(n) : 'Free'; o.classList.toggle('free', !n); };
function syncRange(rg){
  const inp = $('#in-' + rg.dataset.k + '-' + rg.dataset.rf); if(!inp) return;
  const v = Math.max(0, num(inp.value) || 0);
  // the weight slider spans half to one and a half times the starting weight, so each millimetre is a small step
  if(rg.dataset.rf === 'w' && !rg.dataset.top){ rg.dataset.top = '1'; rg.max = Math.max(60, Math.ceil((v * 1.5) / 10) * 10); rg.min = v >= 30 ? Math.floor(v * .5 / 10) * 10 : 0; }
  if(v > +rg.max) rg.max = rg.dataset.rf === 'w' ? Math.ceil((v * 1.25) / 10) * 10 : Math.ceil(v);
  if(v < +rg.min) rg.min = Math.max(0, Math.floor(v * .8 / 10) * 10);
  rg.value = v; paintRange(rg);
}
// iPhone only moves a slider when you hit the thumb itself. Here the whole strip works: tap a spot to jump there, or
// drag sideways from anywhere and the value follows your finger from where it was, without jumping. Like scrubbing a
// video, the further you pull your finger down below the slider while you drag, the slower it moves: gradually, from
// full speed right on the slider down to a tenth of it far below.
// An up or down swipe that starts on the slider is left to the page, so scrolling never changes a value.
function rangeFromX(rg, x){
  const b = rg.getBoundingClientRect(), th = 28, f = Math.min(1, Math.max(0, (x - b.left - th / 2) / Math.max(1, b.width - th)));
  setRange(rg, +rg.min + f * (+rg.max - +rg.min));
}
function setRange(rg, raw){
  const min = +rg.min, max = +rg.max, st = +rg.step || 1, v = Math.min(max, Math.max(min, Math.round(raw / st) * st));
  if(+rg.value !== v){ rg.value = v; rg.dispatchEvent(new Event('input', {bubbles: true})); }
}

function scrubTip(rg, text){

let rgDrag = null;
const dragVal = (d, x) => d.v0 + (x - d.x0) / Math.max(1, d.w - 28) * (+d.rg.max - +d.rg.min) * d.f;

    scrubTip(d.rg, pct >= 98 ? (lvlNew() ? 'Drag down for finer steps' : '') : 'Speed ' + pct + '%');

/* ---------- 1RM test ----------
   Pick a lift and a goal. The test is a workout of its own: a ladder of warm-ups, an opener, a second attempt
   and a PR attempt. Each step fills in its weight and reps, and the best single lands on Records like any other set. */
const RM_STEPS = [[.5, 5, 'Warm-up'], [.7, 3, 'Warm-up'], [.82, 1, 'Warm-up'], [.9, 1, 'Opener'], [.975, 1, 'Second'], [1.025, 1, 'PR attempt']];
const rmLadder = goal => { const st = ST().step || 2.5; return RM_STEPS.map(([f, r, l]) => ({w: Math.max(0, Math.round(goal * f / st) * st), r, l})); };
function rmEstimate(name){ const p = strengthPRs().find(x => x.name === name); return p && p.e1 ? Math.round(p.e1.sc / (ST().step || 2.5)) * (ST().step || 2.5) : 0; }
function renderRmCard(){
  const tests = D.sessions.filter(x => x.template === 'T' && x.kind === 'styrke').slice().sort((a, b) => b.startedAt - a.startedAt).slice(0, 2);
  const rows = tests.map(x => { const name = (x.exercises && x.exercises[0] || {}).name; const best = setsOf(x.id).filter(y => y.reps === 1).sort((a, b) => b.weight - a.weight)[0];
    return name ? '<div class="li rmrow"><span>' + esc(name) + ' <small>' + esc(dShort(x.date)) + '</small></span><b>' + (best ? fmt(best.weight) + ' kg' : !x.endedAt ? 'Running' : 'No single') + '</b></div>' : ''; }).join('');
  setHTML($('#rm-card'), '<div class="hd"><h2>1RM test</h2></div>' + (rows ? '<div class="rmlist">' + rows + '</div>' : '<p class="sub" style="margin-top:4px">Find your max for one rep, step by step.</p>') +
    '<div class="two" style="margin-top:12px"><button class="btn-primary" data-a="rm-open">Test a lift</button><button class="btn-glass" data-a="best-lifts">Best lifts</button></div>');
}
function openRm(){
  const prs = strengthPRs().filter(p => !p.info.bw).sort((a, b) => b.e1.sc - a.e1.sc);
  const names = prs.map(p => p.name), extra = D.lib.filter(x => x.kind === 'b' && !x.bw && !names.includes(x.name)).map(x => x.name);
  const all = names.concat(extra), first = all[0] || 'Bench Press';
  S.ui.rm = {name: first, goal: rmEstimate(first) || 60};
  openSheet('rm', shTop('1RM test'), '<label class="lab" for="rm-ex">Lift</label><select class="sel block" id="rm-ex">' + opts(all.map(n => [n, n]), first) + '</select>' +
    '<div class="steppers slide" style="margin-top:12px"><div class="stp"><label for="rm-goal">goal kg</label><output id="rm-goal-v"></output><input type="range" class="rng" id="rm-goal" min="20" max="300" step="' + (ST().step || 2.5) + '" value="60" aria-label="Goal"></div></div>' +
    '<div class="ladder" id="rm-ladder" style="margin-left:0;margin-right:0;padding:0;flex-wrap:wrap"></div>' +
    '<button class="btn-primary wide" data-a="rm-start" style="margin-top:16px">Start test</button>', false);
  rmSync();
}
function rmSync(){
  const R = S.ui.rm; if(!R) return;
  const g = $('#rm-goal'); if(!g) return;
  if(+g.max < R.goal) g.max = Math.ceil(R.goal * 1.3 / 10) * 10;
  g.value = R.goal; paintRange(g); $('#rm-goal-v').textContent = fmt(R.goal);
  $('#rm-ladder').innerHTML = rmLadder(R.goal).map(x => '<div class="lst"><small>' + x.l + '</small><b>' + fmt(x.w) + ' × ' + x.r + '</b></div>').join('');
}

document.addEventListener('change', e => { if(e.target.id === 'rm-ex' && S.ui.rm){ S.ui.rm.name = e.target.value; S.ui.rm.goal = rmEstimate(e.target.value) || S.ui.rm.goal; rmSync(); } });

/* The keyboard covers the bottom of the page and the page itself does not shrink, so a field low on the page (like the

  const sc = el.closest('.view, .sheet-body, .settings'); if(!sc) return;

  const dy = r.bottom > bottom ? Math.min(r.bottom - bottom, r.top - top) : r.top < top ? r.top - top : 0;
  if(Math.abs(dy) > 2) sc.scrollBy({top: dy, behavior: reduceMotion() ? 'auto' : 'smooth'});

document.addEventListener('input', e => { if(e.target.matches && e.target.matches('textarea')) liftSoon(60); });
if(window.visualViewport) visualViewport.addEventListener('resize', () => {
  if(visualViewport.height > innerHeight * .85){ if(!typingField(document.activeElement)) document.body.classList.remove('kb'); resetScroll(); fixGap(); }
  else if(document.body.classList.contains('kb')) liftSoon(60);
});
if(window.visualViewport) visualViewport.addEventListener('scroll', () => { if(document.activeElement && document.activeElement.closest && document.activeElement.closest('.dock')) liftSoon(0); });
addEventListener('scroll', () => { if(!typingField(document.activeElement)) resetScroll(); }, {passive:true});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#setModal').classList.contains('open')) closeSettings();
  if(e.key === 'Escape' && $('#side').classList.contains('open')) closeSide();
  if(e.key === 'Enter' && e.target.matches && e.target.matches('.stp input, #c-dur, #c-dist, #ci-kg, .field.small, #fd-name, #rd-name, .exs')){ e.preventDefault(); e.target.blur(); }
});
$('#s-note').addEventListener('blur', saveNote);
$('#setModal').inert = true;
$('#side').inert = true;

init();
})();
</script>

</body>
</html>
